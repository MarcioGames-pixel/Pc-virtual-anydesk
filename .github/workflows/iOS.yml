name: Executar QEMU-iOS (n72ap) com Internet e Bore

on:
  workflow_dispatch:

jobs:
  run-emulator:
    runs-on: ubuntu-latest

    steps:

    - name: Checkout
      uses: actions/checkout@v4


    - name: Instalar dependências
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          ninja-build \
          libglib2.0-dev \
          libpixman-1-dev \
          libssl-dev \
          libslirp-dev \
          libsdl2-dev \
          unzip \
          curl


    - name: Baixar e compilar QEMU-iOS
      run: |
        git clone https://github.com/devos50/qemu-ios.git

        cd qemu-ios


        # Corrige warning tratado como erro
        sed -i '/uint16_t level;/d' hw/i2c/ipod_touch_i2c.c || true


        mkdir build
        cd build


        ../configure \
          --enable-sdl \
          --disable-cocoa \
          --target-list=arm-softmmu \
          --disable-capstone \
          --disable-werror \
          --enable-pie \
          --extra-cflags=-I/usr/include/openssl \
          --extra-ldflags='-lcrypto'


        make -j$(nproc)


        echo "$(pwd)" >> $GITHUB_PATH


    - name: Baixar arquivos n72ap
      run: |
        mkdir ios_files
        cd ios_files


        curl -L -o bootrom_240_4 \
        https://github.com/devos50/qemu-ios/releases/download/n72ap_v1/bootrom_240_4


        curl -L -o nand_n72ap.zip \
        https://github.com/devos50/qemu-ios/releases/download/n72ap_v1/nand_n72ap.zip


        curl -L -o nor_n72ap.bin \
        https://github.com/devos50/qemu-ios/releases/download/n72ap_v1/nor_n72ap.bin


        unzip -o nand_n72ap.zip


        echo "Arquivos:"
        ls -lah


        if [ -f nand.bin ]; then
          mv nand.bin nand_n72ap.bin
        fi


        if [ ! -f nand_n72ap.bin ]; then
          echo "Erro: NAND não encontrada"
          exit 1
        fi



    - name: Instalar Bore
      run: |
        curl -L -o bore.tar.gz \
        https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz


        tar -xf bore.tar.gz


        sudo mv bore /usr/local/bin/bore


        bore --version



    - name: Executar QEMU-iOS com Internet e Tunnel
      run: |

        cd ios_files


        echo "Iniciando QEMU..."


        qemu-system-arm \
          -M n72ap \
          -bios bootrom_240_4 \
          -pflash nor_n72ap.bin \
          -drive file=nand_n72ap.bin,if=mtd,format=raw \
          -m 128M \
          -serial stdio \
          -net nic \
          -net user,hostfwd=tcp::2222-:22 \
          > qemu.log 2>&1 &



        echo "Esperando QEMU iniciar..."
        sleep 10



        echo "Abrindo Bore..."

        bore local 2222 --to bore.pub



        echo "Runner mantido ativo"

        while true; do
          sleep 60
        done
