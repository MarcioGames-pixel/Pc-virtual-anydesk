name: QEMU-iOS iPod touch 2G VNC noVNC Bore

on:
  workflow_dispatch:

jobs:
  run-emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            libssl-dev \
            libsdl2-dev \
            libpixman-1-dev \
            libpixman-1-0 \
            libglib2.0-dev \
            libslirp-dev \
            libslirp0 \
            curl \
            git \
            ca-certificates \
            xz-utils \
            tar \
            novnc \
            websockify

      - name: Baixar QEMU-iOS
        run: |
          git clone \
            --depth 1 \
            --branch ipod_touch_2g \
            https://github.com/samhenrigold/qemu-ios.git \
            qemu-ios

          cd qemu-ios
          git rev-parse HEAD
          git branch --show-current

      - name: Configurar QEMU
        working-directory: qemu-ios
        run: |
          mkdir -p build
          cd build

          ../configure \
            --enable-sdl \
            --disable-cocoa \
            --target-list=arm-softmmu \
            --disable-capstone \
            --disable-slirp \
            --extra-cflags=-I/usr/include/openssl \
            --extra-ldflags='-lcrypto' \
            --disable-werror \
            --enable-pie

      - name: Compilar QEMU até o executável
        working-directory: qemu-ios
        run: |
          make -j"$(nproc)"

          QEMU="$PWD/build/arm-softmmu/qemu-system-arm"

          test -x "$QEMU"

          echo "$QEMU" > ../qemu_path.txt

          echo "=========================================="
          echo "COMPILAÇÃO CONCLUÍDA"
          echo "=========================================="
          echo
          echo "Executável:"
          echo "$QEMU"
          echo
          ls -lh "$QEMU"
          echo
          file "$QEMU"
          echo
          "$QEMU" --version
          echo
          echo "SHA256:"
          sha256sum "$QEMU"

      - name: Verificar máquina e display
        working-directory: qemu-ios
        run: |
          QEMU="$PWD/build/arm-softmmu/qemu-system-arm"

          echo "===== MÁQUINAS ====="
          "$QEMU" -M help | grep -i 'iPod\|Touch' || true

          echo
          echo "===== DISPLAY ====="
          "$QEMU" -display help || true

          echo
          echo "===== VNC ====="
          "$QEMU" -vnc help || true

      - name: Criar diretório dos arquivos
        run: |
          mkdir -p ios_files

      - name: Baixar BootROM
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o bootrom_240_4 \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/bootrom_240_4

          test -s bootrom_240_4

      - name: Baixar iBoot
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o iBoot.bin \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/iBoot.bin

          test -s iBoot.bin

      - name: Baixar NOR
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o nor_7E18.bin \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/nor_7E18.bin

          test -s nor_7E18.bin

      - name: Baixar NAND
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o nand-canonical.tar.gz \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/nand-canonical.tar.gz

          test -s nand-canonical.tar.gz

      - name: Extrair NAND
        working-directory: ios_files
        run: |
          rm -rf nand
          mkdir -p nand

          tar -xzf nand-canonical.tar.gz -C nand

          find nand -maxdepth 4 -type f | head -100

          test -d nand

      - name: Verificar arquivos do iPod
        working-directory: ios_files
        run: |
          test -s bootrom_240_4
          test -s iBoot.bin
          test -s nor_7E18.bin
          test -d nand

          echo "BootROM: OK"
          echo "iBoot: OK"
          echo "NOR: OK"
          echo "NAND: OK"

      - name: Instalar Bore
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o bore.tar.gz \
            https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz

          tar -xzf bore.tar.gz
          chmod +x bore
          sudo mv bore /usr/local/bin/bore

          bore --version

      - name: Iniciar QEMU com VNC
        working-directory: ios_files
        run: |
          QEMU="$(cat ../qemu-ios/qemu_path.txt)"

          "$QEMU" \
            -M iPod-Touch,bootrom=bootrom_240_4,nand=nand,nor=nor_7E18.bin \
            -serial mon:stdio \
            -cpu max \
            -m 2G \
            -d unimp,guest_errors \
            -vnc :0 \
            > qemu.log 2>&1 &

          echo $! > qemu.pid

          sleep 15

          if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
            cat qemu.log
            exit 1
          fi

          echo "QEMU ONLINE"
          echo "PID: $(cat qemu.pid)"

      - name: Verificar VNC
        working-directory: ios_files
        run: |
          for i in $(seq 1 10); do
            if ss -lnt | grep -q ':5900'; then
              echo "VNC ONLINE"
              break
            fi

            sleep 2
          done

          if ! ss -lnt | grep -q ':5900'; then
            echo "VNC não abriu a porta 5900."
            tail -200 qemu.log
            exit 1
          fi

      - name: Iniciar noVNC
        working-directory: ios_files
        run: |
          websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > novnc.log 2>&1 &

          echo $! > novnc.pid

          sleep 5

          if ! kill -0 "$(cat novnc.pid)" 2>/dev/null; then
            cat novnc.log
            exit 1
          fi

          echo "noVNC ONLINE"

      - name: Testar noVNC
        working-directory: ios_files
        run: |
          curl -f \
            http://127.0.0.1:6080/vnc.html \
            -o /tmp/vnc.html

          test -s /tmp/vnc.html

          echo "noVNC HTTP OK"

      - name: Expor VNC pelo Bore
        working-directory: ios_files
        run: |
          bore local 5900 \
            --to bore.pub \
            --port 5900 \
            > bore-vnc.log 2>&1 &

          echo $! > bore-vnc.pid

          sleep 5

          if ! kill -0 "$(cat bore-vnc.pid)" 2>/dev/null; then
            cat bore-vnc.log
            exit 1
          fi

          cat bore-vnc.log

      - name: Expor noVNC pelo Bore
        working-directory: ios_files
        run: |
          bore local 6080 \
            --to bore.pub \
            --port 6080 \
            > bore-novnc.log 2>&1 &

          echo $! > bore-novnc.pid

          sleep 10

          if ! kill -0 "$(cat bore-novnc.pid)" 2>/dev/null; then
            cat bore-novnc.log
            exit 1
          fi

          echo
          echo "=========================================="
          echo "IPOD TOUCH 2G ONLINE"
          echo "=========================================="
          echo
          echo "VNC:"
          echo "bore.pub:5900"
          echo
          echo "noVNC:"
          echo "http://bore.pub:6080/vnc.html?autoconnect=true&host=bore.pub&port=6080"
          echo
          echo "=========================================="

      - name: Mostrar executável compilado
        run: |
          QEMU="$(cat qemu-ios/qemu_path.txt)"

          echo "=========================================="
          echo "EXECUTÁVEL COMPILADO"
          echo "=========================================="
          echo
          echo "PATH:"
          echo "$QEMU"
          echo
          echo "TAMANHO:"
          ls -lh "$QEMU"
          echo
          echo "TIPO:"
          file "$QEMU"
          echo
          echo "VERSÃO:"
          "$QEMU" --version
          echo
          echo "SHA256:"
          sha256sum "$QEMU"

      - name: Verificar serviços
        working-directory: ios_files
        run: |
          echo "===== PROCESSOS ====="

          ps aux | grep -E \
            'qemu-system-arm|websockify|bore' \
            | grep -v grep || true

          echo
          echo "===== PORTAS ====="

          ss -lntp | grep -E ':5900|:6080' || true

          echo
          echo "===== QEMU LOG ====="

          tail -100 qemu.log || true

          echo
          echo "===== NOVNC LOG ====="

          tail -100 novnc.log || true

      - name: Manter execução
        working-directory: ios_files
        run: |
          while true; do
            if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
              echo "QEMU encerrou."
              cat qemu.log
              exit 1
            fi

            if ! kill -0 "$(cat novnc.pid)" 2>/dev/null; then
              echo "noVNC encerrou."
              cat novnc.log
              exit 1
            fi

            if ! kill -0 "$(cat bore-vnc.pid)" 2>/dev/null; then
              echo "Bore VNC encerrou."
              cat bore-vnc.log
              exit 1
            fi

            if ! kill -0 "$(cat bore-novnc.pid)" 2>/dev/null; then
              echo "Bore noVNC encerrou."
              cat bore-novnc.log
              exit 1
            fi

            sleep 10
          done

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ios-ipod-touch-2g-logs
          path: |
            ios_files/qemu.log
            ios_files/novnc.log
            ios_files/bore-vnc.log
            ios_files/bore-novnc.log
            qemu-ios/qemu_path.txt
          retention-days: 7
