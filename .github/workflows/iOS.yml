name: QEMU-iOS n72ap VNC Bore

on:
  workflow_dispatch:

jobs:
  run-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            libglib2.0-dev \
            libpixman-1-dev \
            libssl-dev \
            libslirp-dev \
            libsdl2-dev \
            unzip \
            curl

      - name: Compilar QEMU-iOS
        run: |
          git clone --depth 1 https://github.com/devos50/qemu-ios.git
          cd qemu-ios
          mkdir build
          cd build

          ../configure \
            --enable-sdl \
            --disable-cocoa \
            --target-list=arm-softmmu \
            --disable-capstone \
            --disable-werror \
            --enable-pie \
            --extra-cflags=-I/usr/include/openssl \
            --extra-ldflags=-lcrypto

          make -j"$(nproc)"

          echo "$PWD" >> "$GITHUB_PATH"

      - name: Preparar diretório
        run: |
          rm -rf ios_files
          mkdir ios_files

      - name: Baixar bootrom
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o bootrom_240_4 \
            https://github.com/devos50/qemu-ios/releases/download/n72ap_v1/bootrom_240_4

          ls -lh bootrom_240_4
          test -s bootrom_240_4

      - name: Baixar NAND
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o nand_n72ap.zip \
            https://github.com/devos50/qemu-ios/releases/download/n72ap_v1/nand_n72ap.zip

          ls -lh nand_n72ap.zip
          file nand_n72ap.zip
          test -s nand_n72ap.zip

      - name: Baixar NOR
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o nor_n72ap.bin \
            https://github.com/devos50/qemu-ios/releases/download/n72ap_v1/nor_n72ap.bin

          ls -lh nor_n72ap.bin
          test -s nor_n72ap.bin

      - name: Extrair NAND
        working-directory: ios_files
        run: |
          echo "Conteúdo do ZIP:"
          unzip -l nand_n72ap.zip

          echo "Extraindo:"
          unzip -o nand_n72ap.zip

          echo "Arquivos:"
          find . -maxdepth 2 -type f -printf '%p - %s bytes\n'

      - name: Preparar NAND
        working-directory: ios_files
        run: |
          if [ -f nand_n72ap.bin ]; then
            echo "nand_n72ap.bin já existe"
          else
            NAND=$(find . -type f -iname '*nand*.bin' | head -n 1)

            if [ -z "$NAND" ]; then
              echo "NAND não encontrada"
              exit 1
            fi

            echo "NAND encontrada: $NAND"
            cp "$NAND" nand_n72ap.bin
          fi

          ls -lh nand_n72ap.bin
          test -s nand_n72ap.bin

      - name: Validar arquivos
        working-directory: ios_files
        run: |
          echo "=== BOOTROM ==="
          ls -lh bootrom_240_4

          echo "=== NOR ==="
          ls -lh nor_n72ap.bin

          echo "=== NAND ==="
          ls -lh nand_n72ap.bin

          echo "=== TODOS ==="
          ls -lah

      - name: Instalar Bore
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o bore.tar.gz \
            https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz

          tar -xzf bore.tar.gz
          chmod +x bore
          sudo mv bore /usr/local/bin/bore

          bore --version

      - name: Iniciar QEMU
        working-directory: ios_files
        run: |
          qemu-system-arm \
            -M n72ap \
            -bios bootrom_240_4 \
            -pflash nor_n72ap.bin \
            -drive file=nand_n72ap.bin,if=mtd,format=raw \
            -m 128M \
            -serial stdio \
            -vnc :0 \
            -net nic \
            -net user \
            > qemu.log 2>&1 &

          echo $! > qemu.pid

          sleep 15

          if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
            echo "QEMU encerrou."
            cat qemu.log
            exit 1
          fi

          echo "QEMU está rodando."
          cat qemu.log

      - name: Abrir VNC
        working-directory: ios_files
        run: |
          bore local 5900 \
            --to bore.pub \
            --port 5900 \
            > bore.log 2>&1 &

          echo $! > bore.pid

          sleep 10

          echo "================================"
          echo "VNC: bore.pub:5900"
          echo "================================"

          cat bore.log

      - name: Manter QEMU ativo
        working-directory: ios_files
        run: |
          while true; do
            if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
              echo "QEMU encerrou."
              cat qemu.log
              exit 1
            fi

            if ! kill -0 "$(cat bore.pid)" 2>/dev/null; then
              echo "Bore encerrou."
              cat bore.log
              exit 1
            fi

            sleep 10
          done
