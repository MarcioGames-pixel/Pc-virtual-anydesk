name: QEMU-iOS n72ap VNC Bore Cache

on:
  workflow_dispatch:

jobs:
  run-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            libssl-dev \
            libsdl2-dev \
            libpixman-1-dev \
            libpixman-1-0 \
            libglib2.0-dev \
            libslirp-dev \
            unzip \
            curl

      - name: Compilar QEMU-iOS
        run: |
          git clone --depth 1 https://github.com/devos50/qemu-ios.git

          cd qemu-ios
          mkdir build
          cd build

          ../configure \
            --enable-sdl \
            --disable-cocoa \
            --target-list=arm-softmmu \
            --disable-capstone \
            --disable-slirp \
            --extra-cflags=-I/usr/include/openssl \
            --extra-ldflags='-lcrypto' \
            --disable-werror \
            --enable-pie

          make -j"$(nproc)"

          test -x arm-softmmu/qemu-system-arm

      - name: Criar diretório
        run: |
          mkdir -p ios_files

      - name: Restaurar cache n72ap
        id: cache-n72ap
        uses: actions/cache@v4
        with:
          path: ios_files
          key: n72ap-v1-files

      - name: Baixar arquivos n72ap
        if: steps.cache-n72ap.outputs.cache-hit != 'true'
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o bootrom_240_4 \
            https://github.com/devos50/qemu-ios/releases/download/n72ap_v1/bootrom_240_4

          curl -fL --retry 5 --retry-delay 3 \
            -o nand_n72ap.zip \
            https://github.com/devos50/qemu-ios/releases/download/n72ap_v1/nand_n72ap.zip

          curl -fL --retry 5 --retry-delay 3 \
            -o nor_n72ap.bin \
            https://github.com/devos50/qemu-ios/releases/download/n72ap_v1/nor_n72ap.bin

          unzip -o nand_n72ap.zip

          rm -f nand_n72ap.zip

          test -s bootrom_240_4
          test -s nor_n72ap.bin
          test -d nand

          echo "Arquivos n72ap preparados:"
          ls -lh
          du -sh nand

      - name: Verificar cache
        working-directory: ios_files
        run: |
          echo "Conteúdo:"
          ls -lh

          test -s bootrom_240_4
          test -s nor_n72ap.bin
          test -d nand

          echo "NAND:"
          find nand -type f | head -20

      - name: Instalar Bore
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o bore.tar.gz \
            https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz

          tar -xzf bore.tar.gz
          chmod +x bore
          sudo mv bore /usr/local/bin/bore

          bore --version

      - name: Iniciar QEMU-iOS
        working-directory: ios_files
        run: |
          QEMU="../qemu-ios/build/arm-softmmu/qemu-system-arm"

          test -x "$QEMU"
          test -f bootrom_240_4
          test -f nor_n72ap.bin
          test -d nand

          "$QEMU" \
            -M iPod-Touch,bootrom=bootrom_240_4,nand=nand,nor=nor_n72ap.bin \
            -serial mon:stdio \
            -cpu max \
            -m 2G \
            -d unimp \
            -vnc :0 \
            -net nic \
            -net user \
            > qemu.log 2>&1 &

          echo $! > qemu.pid

          sleep 15

          if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
            echo "QEMU encerrou."
            cat qemu.log
            exit 1
          fi

          echo "QEMU executando."

      - name: Abrir VNC
        working-directory: ios_files
        run: |
          bore local 5900 \
            --to bore.pub \
            --port 5900 \
            > bore.log 2>&1 &

          echo $! > bore.pid

          sleep 10

          echo "======================================"
          echo "VNC: bore.pub:5900"
          echo "======================================"

          cat bore.log

      - name: Manter execução
        working-directory: ios_files
        run: |
          while true; do
            if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
              echo "QEMU encerrou."
              cat qemu.log
              exit 1
            fi

            if ! kill -0 "$(cat bore.pid)" 2>/dev/null; then
              echo "Bore encerrou."
              cat bore.log
              exit 1
            fi

            sleep 10
          done

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ios-logs
          path: |
            ios_files/qemu.log
            ios_files/bore.log
          retention-days: 7
