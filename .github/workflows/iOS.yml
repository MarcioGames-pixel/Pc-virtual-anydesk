name: QEMU-iOS iPod touch 2G 2026.08 VNC Bore

on:
  workflow_dispatch:

jobs:
  run-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            libssl-dev \
            libsdl2-dev \
            libpixman-1-dev \
            libpixman-1-0 \
            libglib2.0-dev \
            libslirp-dev \
            libslirp0 \
            curl \
            git \
            ca-certificates \
            xz-utils \
            tar

      - name: Baixar QEMU-iOS 2026.08
        run: |
          git clone \
            --depth 1 \
            --branch ipod_touch_2g \
            https://github.com/samhenrigold/qemu-ios.git

          cd qemu-ios

          echo "======================================"
          echo "QEMU-iOS"
          echo "======================================"

          echo "Branch:"
          git branch --show-current

          echo
          echo "Commit:"
          git rev-parse HEAD

      - name: Compilar QEMU-iOS
        working-directory: qemu-ios
        run: |
          mkdir -p build
          cd build

          ../configure \
            --enable-sdl \
            --disable-cocoa \
            --target-list=arm-softmmu \
            --disable-capstone \
            --disable-slirp \
            --extra-cflags=-I/usr/include/openssl \
            --extra-ldflags='-lcrypto' \
            --disable-werror \
            --enable-pie

          echo "======================================"
          echo "COMPILANDO QEMU"
          echo "======================================"

          make -j"$(nproc)"

          echo "======================================"
          echo "COMPILAÇÃO TERMINADA"
          echo "======================================"

          echo "===== EXECUTÁVEIS ====="

          find . \
            -type f \
            -name "qemu-system-arm" \
            -ls

      - name: Criar diretório dos arquivos
        run: |
          mkdir -p ios_files

      - name: Baixar BootROM
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o bootrom_240_4 \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/bootrom_240_4

          test -s bootrom_240_4

          echo "===== BOOTROM ====="
          ls -lh bootrom_240_4

      - name: Baixar iBoot
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o iBoot.bin \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/iBoot.bin

          test -s iBoot.bin

          echo "===== IBOOT ====="
          ls -lh iBoot.bin

      - name: Baixar NOR
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o nor_7E18.bin \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/nor_7E18.bin

          test -s nor_7E18.bin

          echo "===== NOR ====="
          ls -lh nor_7E18.bin

      - name: Baixar NAND canonical
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o nand-canonical.tar.gz \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/nand-canonical.tar.gz

          test -s nand-canonical.tar.gz

          echo "===== NAND ====="
          ls -lh nand-canonical.tar.gz

      - name: Extrair NAND
        working-directory: ios_files
        run: |
          rm -rf nand
          mkdir -p nand

          tar -xzf nand-canonical.tar.gz -C nand

          echo "======================================"
          echo "NAND EXTRAÍDA"
          echo "======================================"

          find nand -maxdepth 4 -type f | head -100

          test -d nand

      - name: Instalar Bore
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o bore.tar.gz \
            https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz

          tar -xzf bore.tar.gz

          chmod +x bore

          sudo mv bore /usr/local/bin/bore

          bore --version

      - name: Localizar QEMU
        run: |
          echo "======================================"
          echo "PROCURANDO QEMU-SYSTEM-ARM"
          echo "======================================"

          find qemu-ios/build \
            -type f \
            -name "qemu-system-arm" \
            -ls

          QEMU="$(find "$GITHUB_WORKSPACE/qemu-ios/build" \
            -type f \
            -name "qemu-system-arm" \
            -perm -111 \
            | head -n 1)"

          if [ -z "$QEMU" ]; then
            echo "QEMU não encontrado."
            exit 1
          fi

          echo "$QEMU" > qemu_path.txt

          echo
          echo "QEMU encontrado:"
          cat qemu_path.txt

          echo
          echo "Versão:"
          "$QEMU" --version

      - name: Verificar arquivos
        working-directory: ios_files
        run: |
          QEMU="$(cat ../qemu_path.txt)"

          echo "======================================"
          echo "VERIFICANDO ARQUIVOS"
          echo "======================================"

          test -x "$QEMU"
          test -s bootrom_240_4
          test -s iBoot.bin
          test -s nor_7E18.bin
          test -d nand

          echo
          echo "===== QEMU ====="
          "$QEMU" --version

          echo
          echo "===== ARQUIVOS ====="
          ls -lah

          echo
          echo "===== NAND ====="
          find nand -maxdepth 4 -type f -print

      - name: Iniciar QEMU-iOS
        working-directory: ios_files
        run: |
          QEMU="$(cat ../qemu_path.txt)"

          test -x "$QEMU"
          test -s bootrom_240_4
          test -s nor_7E18.bin
          test -d nand

          echo "======================================"
          echo "INICIANDO IPOD TOUCH 2G"
          echo "======================================"
          echo "iOS 3.1.3"
          echo "Build 7E18"
          echo "======================================"

          "$QEMU" \
            -M iPod-Touch,bootrom=bootrom_240_4,nand=nand,nor=nor_7E18.bin \
            -serial mon:stdio \
            -cpu max \
            -m 2G \
            -d unimp \
            -vnc :0 \
            > qemu.log 2>&1 &

          QEMU_PID=$!

          echo "$QEMU_PID" > qemu.pid

          echo "QEMU PID: $QEMU_PID"

          sleep 20

          if ! kill -0 "$QEMU_PID" 2>/dev/null; then
            echo "======================================"
            echo "QEMU ENCERROU"
            echo "======================================"

            echo
            echo "===== QEMU LOG ====="

            cat qemu.log

            exit 1
          fi

          echo
          echo "======================================"
          echo "QEMU ESTÁ EXECUTANDO"
          echo "======================================"

      - name: Abrir VNC pelo Bore
        working-directory: ios_files
        run: |
          echo "Iniciando Bore..."

          bore local 5900 \
            --to bore.pub \
            --port 5900 \
            > bore.log 2>&1 &

          BORE_PID=$!

          echo "$BORE_PID" > bore.pid

          sleep 10

          echo
          echo "======================================"
          echo "       IPOD TOUCH 2G - VNC"
          echo "======================================"

          echo
          echo "Servidor:"
          echo "bore.pub:5900"

          echo
          echo "===== BORE LOG ====="

          cat bore.log

      - name: Verificar processos
        working-directory: ios_files
        run: |
          echo "===== PROCESSOS ====="

          ps aux | grep -E \
            'qemu-system-arm|bore' \
            | grep -v grep || true

          echo
          echo "===== QEMU PID ====="

          cat qemu.pid

          echo
          echo "===== BORE PID ====="

          cat bore.pid

          echo
          echo "===== PORTA VNC ====="

          ss -lntp | grep ':5900' || true

      - name: Manter em execução
        working-directory: ios_files
        run: |
          echo "======================================"
          echo "EMULADOR ONLINE"
          echo "======================================"

          echo "VNC: bore.pub:5900"

          echo "======================================"

          while true; do

            if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
              echo
              echo "QEMU encerrou."

              echo "===== QEMU LOG ====="
              cat qemu.log

              exit 1
            fi

            if ! kill -0 "$(cat bore.pid)" 2>/dev/null; then
              echo
              echo "Bore encerrou."

              echo "===== BORE LOG ====="
              cat bore.log

              exit 1
            fi

            sleep 10

          done

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ios-ipod-touch-2g-2026-08-logs
          path: |
            ios_files/qemu.log
            ios_files/bore.log
            qemu_path.txt
          retention-days: 7
