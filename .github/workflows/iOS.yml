name: QEMU-iOS iPod touch 2G VNC noVNC Bore

on:
  workflow_dispatch:

jobs:
  run-emulator:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            libssl-dev \
            libsdl2-dev \
            libpixman-1-dev \
            libpixman-1-0 \
            libglib2.0-dev \
            libslirp-dev \
            libslirp0 \
            curl \
            git \
            ca-certificates \
            xz-utils \
            tar \
            novnc \
            websockify

      - name: Baixar QEMU-iOS
        run: |
          git clone \
            --depth 1 \
            --branch ipod_touch_2g \
            https://github.com/samhenrigold/qemu-ios.git \
            qemu-ios

          cd qemu-ios

          echo "=========================================="
          echo "QEMU-iOS"
          echo "=========================================="

          git remote -v
          git rev-parse HEAD
          git branch --show-current

      - name: Configurar QEMU
        working-directory: qemu-ios
        run: |
          rm -rf build
          mkdir -p build

          cd build

          ../configure \
            --enable-sdl \
            --disable-cocoa \
            --target-list=arm-softmmu \
            --disable-capstone \
            --disable-slirp \
            --extra-cflags=-I/usr/include/openssl \
            --extra-ldflags='-lcrypto' \
            --disable-werror \
            --enable-pie

          echo
          echo "=========================================="
          echo "CONFIGURE CONCLUÍDO"
          echo "=========================================="

          test -f Makefile

          pwd
          ls -lh Makefile

      - name: Compilar QEMU até o executável
        working-directory: qemu-ios/build
        run: |
          echo "=========================================="
          echo "INICIANDO COMPILAÇÃO"
          echo "=========================================="

          make -j"$(nproc)" V=1

          echo
          echo "=========================================="
          echo "COMPILAÇÃO CONCLUÍDA"
          echo "=========================================="

          echo
          echo "PROCURANDO qemu-system-arm..."

          QEMU="$(find "$PWD" -type f -name 'qemu-system-arm' | head -n 1)"

          if [ -z "$QEMU" ]; then
            echo
            echo "ERRO: qemu-system-arm não foi encontrado."
            echo
            echo "Arquivos qemu encontrados:"
            find "$PWD" -type f -name '*qemu-system*' -print
            echo
            echo "Executáveis encontrados:"
            find "$PWD" -type f -perm -111 -print | head -200
            exit 1
          fi

          chmod +x "$QEMU"

          echo
          echo "=========================================="
          echo "EXECUTÁVEL ENCONTRADO"
          echo "=========================================="

          echo
          echo "CAMINHO:"
          realpath "$QEMU"

          echo
          echo "ARQUIVO:"
          ls -lh "$QEMU"

          echo
          echo "TIPO:"
          file "$QEMU"

          echo
          echo "VERSÃO:"
          "$QEMU" --version

          echo
          echo "SHA256:"
          sha256sum "$QEMU"

          realpath "$QEMU" > ../../qemu_path.txt

          echo
          echo "CAMINHO SALVO:"
          cat ../../qemu_path.txt

      - name: Verificar máquina iPod-Touch
        run: |
          QEMU="$(cat qemu_path.txt)"

          echo "QEMU:"
          echo "$QEMU"

          echo
          echo "MÁQUINAS DISPONÍVEIS:"

          "$QEMU" -M help | grep -iE 'ipod|touch' || {
            echo "ERRO: máquina iPod-Touch não encontrada."
            "$QEMU" -M help
            exit 1
          }

      - name: Verificar suporte VNC
        run: |
          QEMU="$(cat qemu_path.txt)"

          echo "=========================================="
          echo "DISPLAY"
          echo "=========================================="

          "$QEMU" -display help || true

          echo
          echo "=========================================="
          echo "VNC"
          echo "=========================================="

          "$QEMU" -vnc help || true

      - name: Criar diretório iOS
        run: |
          rm -rf ios_files
          mkdir -p ios_files

      - name: Baixar BootROM
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o bootrom_240_4 \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/bootrom_240_4

          test -s bootrom_240_4

          echo "BootROM:"
          ls -lh bootrom_240_4

      - name: Baixar iBoot
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o iBoot.bin \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/iBoot.bin

          test -s iBoot.bin

          echo "iBoot:"
          ls -lh iBoot.bin

      - name: Baixar NOR
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o nor_7E18.bin \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/nor_7E18.bin

          test -s nor_7E18.bin

          echo "NOR:"
          ls -lh nor_7E18.bin

      - name: Baixar NAND
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o nand-canonical.tar.gz \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/nand-canonical.tar.gz

          test -s nand-canonical.tar.gz

          echo "NAND:"
          ls -lh nand-canonical.tar.gz

      - name: Extrair NAND
        working-directory: ios_files
        run: |
          rm -rf nand
          mkdir -p nand

          tar -xzf nand-canonical.tar.gz -C nand

          echo "=========================================="
          echo "NAND EXTRAÍDA"
          echo "=========================================="

          find nand -maxdepth 4 -type f -print | head -200

      - name: Instalar Bore
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o bore.tar.gz \
            https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz

          tar -xzf bore.tar.gz

          chmod +x bore

          sudo mv bore /usr/local/bin/bore

          echo "Bore:"
          bore --version

      - name: Iniciar QEMU
        working-directory: ios_files
        run: |
          QEMU="$(cat ../qemu_path.txt)"

          echo "=========================================="
          echo "INICIANDO QEMU-iOS"
          echo "=========================================="

          echo "QEMU:"
          echo "$QEMU"

          "$QEMU" \
            -M iPod-Touch,bootrom=bootrom_240_4,nand=nand,nor=nor_7E18.bin \
            -serial mon:stdio \
            -cpu max \
            -m 2G \
            -d unimp,guest_errors \
            -vnc :0 \
            > qemu.log 2>&1 &

          echo $! > qemu.pid

          echo "PID:"
          cat qemu.pid

          echo
          echo "Aguardando QEMU..."

          sleep 15

          if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
            echo "ERRO: QEMU encerrou."

            echo
            echo "LOG DO QEMU:"
            cat qemu.log

            exit 1
          fi

          echo
          echo "QEMU ONLINE"

          echo
          echo "PROCESSO:"
          ps -p "$(cat qemu.pid)" -f || true

      - name: Verificar servidor VNC
        working-directory: ios_files
        run: |
          echo "=========================================="
          echo "AGUARDANDO VNC :5900"
          echo "=========================================="

          for i in $(seq 1 30); do
            if ss -lnt | grep -q ':5900'; then
              echo "VNC ONLINE NA PORTA 5900"
              break
            fi

            echo "Tentativa $i/30..."
            sleep 2
          done

          if ! ss -lnt | grep -q ':5900'; then
            echo "ERRO: VNC não abriu a porta 5900."

            echo
            echo "PORTAS:"
            ss -lnt || true

            echo
            echo "LOG DO QEMU:"
            cat qemu.log

            exit 1
          fi

          echo
          echo "VNC:"
          ss -lnt | grep ':5900'

      - name: Iniciar noVNC
        working-directory: ios_files
        run: |
          echo "=========================================="
          echo "INICIANDO NOVNC"
          echo "=========================================="

          websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > novnc.log 2>&1 &

          echo $! > novnc.pid

          sleep 5

          if ! kill -0 "$(cat novnc.pid)" 2>/dev/null; then
            echo "ERRO: noVNC/websockify encerrou."

            echo
            echo "LOG NOVNC:"
            cat novnc.log

            exit 1
          fi

          echo "noVNC ONLINE"

      - name: Verificar noVNC
        working-directory: ios_files
        run: |
          echo "=========================================="
          echo "TESTANDO NOVNC"
          echo "=========================================="

          curl -f \
            http://127.0.0.1:6080/vnc.html \
            -o /tmp/vnc.html

          test -s /tmp/vnc.html

          echo "noVNC HTTP OK"

          echo
          echo "PORTA:"
          ss -lnt | grep ':6080'

      - name: Expor VNC pelo Bore
        working-directory: ios_files
        run: |
          echo "=========================================="
          echo "BORE VNC"
          echo "=========================================="

          bore local 5900 \
            --to bore.pub \
            --port 5900 \
            > bore-vnc.log 2>&1 &

          echo $! > bore-vnc.pid

          sleep 8

          if ! kill -0 "$(cat bore-vnc.pid)" 2>/dev/null; then
            echo "ERRO: Bore VNC encerrou."
            cat bore-vnc.log
            exit 1
          fi

          cat bore-vnc.log

      - name: Expor noVNC pelo Bore
        working-directory: ios_files
        run: |
          echo "=========================================="
          echo "BORE NOVNC"
          echo "=========================================="

          bore local 6080 \
            --to bore.pub \
            --port 6080 \
            > bore-novnc.log 2>&1 &

          echo $! > bore-novnc.pid

          sleep 10

          if ! kill -0 "$(cat bore-novnc.pid)" 2>/dev/null; then
            echo "ERRO: Bore noVNC encerrou."
            cat bore-novnc.log
            exit 1
          fi

          echo
          echo "=========================================="
          echo "ACESSO AO IPOD TOUCH 2G"
          echo "=========================================="

          cat bore-novnc.log

          echo
          echo "VNC:"
          echo "bore.pub:5900"

          echo
          echo "NOVNC:"
          echo "http://bore.pub:6080/vnc.html?autoconnect=true"

          echo
          echo "NOVNC COM HOST:"
          echo "http://bore.pub:6080/vnc.html?autoconnect=true&host=bore.pub&port=5900"

      - name: Diagnóstico final
        working-directory: ios_files
        run: |
          echo "=========================================="
          echo "DIAGNÓSTICO FINAL"
          echo "=========================================="

          echo
          echo "PROCESSOS:"
          ps aux | grep -E 'qemu-system-arm|websockify|bore' | grep -v grep || true

          echo
          echo "PORTAS:"
          ss -lnt | grep -E ':5900|:6080' || true

          echo
          echo "QEMU PID:"
          cat qemu.pid || true

          echo
          echo "NOVNC PID:"
          cat novnc.pid || true

          echo
          echo "BORE VNC PID:"
          cat bore-vnc.pid || true

          echo
          echo "BORE NOVNC PID:"
          cat bore-novnc.pid || true

          echo
          echo "=========================================="
          echo "EXECUTÁVEL COMPILADO"
          echo "=========================================="

          QEMU="$(cat ../qemu_path.txt)"

          echo
          echo "CAMINHO:"
          echo "$QEMU"

          echo
          echo "TAMANHO:"
          ls -lh "$QEMU"

          echo
          echo "TIPO:"
          file "$QEMU"

          echo
          echo "VERSÃO:"
          "$QEMU" --version

          echo
          echo "SHA256:"
          sha256sum "$QEMU"

          echo
          echo "=========================================="
          echo "FIM DO DIAGNÓSTICO"
          echo "=========================================="

      - name: Publicar executável QEMU
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-arm-ipod-touch-2g
          path: qemu-ios/build/qemu-system-arm
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ios-ipod-touch-2g-logs
          path: |
            ios_files/qemu.log
            ios_files/novnc.log
            ios_files/bore-vnc.log
            ios_files/bore-novnc.log
            qemu_path.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Manter execução
        working-directory: ios_files
        run: |
          echo "=========================================="
          echo "EMULADOR ONLINE"
          echo "=========================================="

          echo
          echo "noVNC:"
          echo "http://bore.pub:6080/vnc.html?autoconnect=true"

          echo
          echo "VNC:"
          echo "bore.pub:5900"

          echo
          echo "Aguardando..."

          while true; do

            if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
              echo "QEMU encerrou."

              echo
              echo "LOG DO QEMU:"
              cat qemu.log

              exit 1
            fi

            if ! kill -0 "$(cat novnc.pid)" 2>/dev/null; then
              echo "noVNC encerrou."

              echo
              echo "LOG DO NOVNC:"
              cat novnc.log

              exit 1
            fi

            if ! kill -0 "$(cat bore-vnc.pid)" 2>/dev/null; then
              echo "Bore VNC encerrou."

              echo
              echo "LOG BORE VNC:"
              cat bore-vnc.log

              exit 1
            fi

            if ! kill -0 "$(cat bore-novnc.pid)" 2>/dev/null; then
              echo "Bore noVNC encerrou."

              echo
              echo "LOG BORE NOVNC:"
              cat bore-novnc.log

              exit 1
            fi

            sleep 10
          done
