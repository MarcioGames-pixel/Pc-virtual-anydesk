name: QEMU-iOS iPod touch 2G 2026.08 VNC Bore

on:
  workflow_dispatch:

jobs:
  run-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependências
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            libssl-dev \
            libsdl2-dev \
            libpixman-1-dev \
            libpixman-1-0 \
            libglib2.0-dev \
            libslirp-dev \
            libslirp0 \
            libzstd-dev \
            libcap-ng-dev \
            libattr1-dev \
            libaio-dev \
            liburing-dev \
            libseccomp-dev \
            libfdt-dev \
            libusb-1.0-0-dev \
            libepoxy-dev \
            curl \
            git \
            ca-certificates \
            xz-utils \
            tar

      - name: Verificar OpenSSL
        run: |
          openssl version
          pkg-config --modversion openssl
          pkg-config --libs openssl
          ls -lh /usr/lib/x86_64-linux-gnu/libcrypto.so*

      - name: Clonar QEMU-iOS
        run: |
          git clone \
            --depth 1 \
            --branch ipod_touch_2g \
            https://github.com/samhenrigold/qemu-ios.git

          cd qemu-ios

          echo "===== BRANCH ====="
          git branch --show-current

          echo "===== COMMIT ====="
          git rev-parse HEAD

      - name: Configurar QEMU-iOS
        working-directory: qemu-ios
        run: |
          rm -rf build
          mkdir -p build
          cd build

          export CFLAGS="-I/usr/include/openssl"
          export LDFLAGS="-L/usr/lib/x86_64-linux-gnu -lcrypto"

          ../configure \
            --enable-sdl \
            --disable-cocoa \
            --target-list=arm-softmmu \
            --disable-capstone \
            --disable-slirp \
            --disable-werror \
            --extra-cflags="-I/usr/include/openssl" \
            --extra-ldflags="-L/usr/lib/x86_64-linux-gnu -lcrypto"

      - name: Compilar QEMU ARM
        working-directory: qemu-ios/build
        run: |
          echo "======================================"
          echo "COMPILANDO QEMU-SYSTEM-ARM"
          echo "======================================"

          make -j"$(nproc)" qemu-system-arm

          echo "======================================"
          echo "COMPILAÇÃO TERMINADA"
          echo "======================================"

          test -x arm-softmmu/qemu-system-arm

          ls -lh arm-softmmu/qemu-system-arm

      - name: Criar diretório dos arquivos
        run: |
          mkdir -p ios_files

      - name: Baixar BootROM
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o bootrom_240_4 \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/bootrom_240_4

          test -s bootrom_240_4

          echo "===== BOOTROM ====="
          ls -lh bootrom_240_4

      - name: Baixar iBoot
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o iBoot.bin \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/iBoot.bin

          test -s iBoot.bin

          echo "===== IBOOT ====="
          ls -lh iBoot.bin

      - name: Baixar NOR
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o nor_7E18.bin \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/nor_7E18.bin

          test -s nor_7E18.bin

          echo "===== NOR ====="
          ls -lh nor_7E18.bin

      - name: Baixar NAND
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o nand-canonical.tar.gz \
            https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/nand-canonical.tar.gz

          test -s nand-canonical.tar.gz

          echo "===== NAND ====="
          ls -lh nand-canonical.tar.gz

      - name: Extrair NAND
        working-directory: ios_files
        run: |
          mkdir -p nand

          tar -xzf nand-canonical.tar.gz -C nand

          echo "======================================"
          echo "NAND EXTRAÍDA"
          echo "======================================"

          find nand -maxdepth 3 -type f | head -100

          test -d nand

      - name: Instalar Bore
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o bore.tar.gz \
            https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz

          tar -xzf bore.tar.gz

          chmod +x bore

          sudo mv bore /usr/local/bin/bore

          bore --version

      - name: Verificar QEMU e arquivos
        working-directory: ios_files
        run: |
          QEMU="../qemu-ios/build/arm-softmmu/qemu-system-arm"

          test -x "$QEMU"
          test -f bootrom_240_4
          test -f iBoot.bin
          test -f nor_7E18.bin
          test -d nand

          echo "======================================"
          echo "QEMU"
          echo "======================================"

          "$QEMU" --version

          echo
          echo "======================================"
          echo "ARQUIVOS"
          echo "======================================"

          ls -lh

          echo
          echo "======================================"
          echo "NAND"
          echo "======================================"

          find nand -maxdepth 3 -type f -print

      - name: Iniciar QEMU-iOS
        working-directory: ios_files
        run: |
          QEMU="../qemu-ios/build/arm-softmmu/qemu-system-arm"

          test -x "$QEMU"
          test -f bootrom_240_4
          test -f nor_7E18.bin
          test -d nand

          echo "======================================"
          echo "INICIANDO IPOD TOUCH 2G"
          echo "iOS 3.1.3"
          echo "Build 7E18"
          echo "======================================"

          "$QEMU" \
            -M iPod-Touch,bootrom=bootrom_240_4,nand=nand,nor=nor_7E18.bin \
            -serial mon:stdio \
            -cpu max \
            -m 2G \
            -d unimp \
            -vnc :0 \
            > qemu.log 2>&1 &

          QEMU_PID=$!

          echo "$QEMU_PID" > qemu.pid

          echo "QEMU PID: $QEMU_PID"

          sleep 20

          if ! kill -0 "$QEMU_PID" 2>/dev/null; then
            echo "======================================"
            echo "QEMU ENCERROU"
            echo "======================================"

            echo "===== QEMU LOG ====="
            cat qemu.log

            exit 1
          fi

          echo "======================================"
          echo "QEMU ESTÁ EXECUTANDO"
          echo "======================================"

      - name: Abrir VNC pelo Bore
        working-directory: ios_files
        run: |
          echo "Iniciando Bore..."

          bore local 5900 \
            --to bore.pub \
            --port 5900 \
            > bore.log 2>&1 &

          BORE_PID=$!

          echo "$BORE_PID" > bore.pid

          sleep 10

          echo "======================================"
          echo "IPOD TOUCH 2G - VNC"
          echo "======================================"

          echo "VNC: bore.pub:5900"

          echo
          echo "===== BORE LOG ====="

          cat bore.log

      - name: Verificar processos
        working-directory: ios_files
        run: |
          echo "===== PROCESSOS ====="

          ps aux | grep -E \
            'qemu-system-arm|bore' \
            | grep -v grep || true

          echo
          echo "===== PORTA VNC ====="

          ss -lntp | grep ':5900' || true

          echo
          echo "===== QEMU PID ====="

          cat qemu.pid

          echo
          echo "===== BORE PID ====="

          cat bore.pid

      - name: Manter em execução
        working-directory: ios_files
        run: |
          echo "======================================"
          echo "EMULADOR ONLINE"
          echo "======================================"

          echo "VNC: bore.pub:5900"

          echo "======================================"

          while true; do

            if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
              echo "QEMU encerrou."

              echo "===== QEMU LOG ====="
              cat qemu.log

              exit 1
            fi

            if ! kill -0 "$(cat bore.pid)" 2>/dev/null; then
              echo "Bore encerrou."

              echo "===== BORE LOG ====="
              cat bore.log

              exit 1
            fi

            sleep 10
          done

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-ios-ipod-touch-2g-2026-08-logs
          path: |
            ios_files/qemu.log
            ios_files/bore.log
          retention-days: 7
