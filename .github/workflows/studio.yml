name: Android 2.3 VNC Bore Cache

on:
  workflow_dispatch:

jobs:
  android23:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            wget \
            unzip \
            curl \
            xvfb \
            x11vnc \
            fluxbox \
            libpulse0 \
            libnss3 \
            libx11-6 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxrandr2 \
            libxtst6 \
            libglu1-mesa

          echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-17-openjdk-amd64/bin" >> "$GITHUB_PATH"

          sudo update-alternatives --set java \
            /usr/lib/jvm/java-17-openjdk-amd64/bin/java

          sudo update-alternatives --set javac \
            /usr/lib/jvm/java-17-openjdk-amd64/bin/javac

          java -version

      - name: Instalar Android SDK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"

          mkdir -p "$HOME/android-sdk/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O sdk.zip

          rm -rf "$HOME/android-sdk/cmdline-tools/latest"

          unzip -q sdk.zip \
            -d "$HOME/android-sdk/cmdline-tools"

          mv \
            "$HOME/android-sdk/cmdline-tools/cmdline-tools" \
            "$HOME/android-sdk/cmdline-tools/latest"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/emulator" >> "$GITHUB_PATH"

      - name: Verificar SDK Manager
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          which java
          java -version

          which sdkmanager
          sdkmanager --version

      - name: Aceitar licenças
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses || true

      - name: Instalar ferramentas
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          sdkmanager \
            "platform-tools" \
            "emulator"

      - name: Instalar imagem Android 2.3
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager \
            "system-images;android-9;default;x86"

          test -d \
            "$HOME/android-sdk/system-images/android-9/default/x86"

      - name: Restaurar cache do AVD
        id: cache-avd
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd
            ~/.android/adb*
          key: android23-avd-v3-${{ runner.os }}

      - name: Criar AVD sem hardware profile
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$HOME/android-sdk/cmdline-tools/latest/bin:$HOME/android-sdk/emulator:$HOME/android-sdk/platform-tools:$PATH"

          mkdir -p "$HOME/.android/avd"

          if [ -d "$HOME/.android/avd/Android23.avd" ] &&
             [ -f "$HOME/.android/avd/Android23.ini" ]; then

            echo "AVD restaurado do cache."

          else

            echo "AVD não encontrado."
            echo "Criando sem hardware profile..."

            rm -rf "$HOME/.android/avd/Android23.avd"
            rm -f "$HOME/.android/avd/Android23.ini"

            printf "no\n" | avdmanager create avd \
              --name Android23 \
              --package "system-images;android-9;default;x86" \
              --force

          fi

          echo "=== AVDs ==="
          emulator -list-avds

          echo "=== ARQUIVOS ==="
          find "$HOME/.android/avd" \
            -maxdepth 2 \
            -print

          test -d "$HOME/.android/avd/Android23.avd"
          test -f "$HOME/.android/avd/Android23.ini"

      - name: Configurar AVD
        run: |
          AVD="$HOME/.android/avd/Android23.avd"

          test -d "$AVD"

          cat >> "$AVD/config.ini" <<'EOF'
          hw.keyboard=yes
          hw.mainKeys=yes
          hw.audioInput=no
          hw.audioOutput=no
          hw.lcd.width=800
          hw.lcd.height=600
          hw.lcd.density=160
          hw.ramSize=1024
          hw.cpu.ncore=2
          hw.gpu.enabled=yes
          hw.gpu.mode=swiftshader_indirect
          hw.sdCard=yes
          disk.dataPartition.size=2048M
          EOF

          echo "=== CONFIG ==="
          cat "$AVD/config.ini"

      - name: Iniciar Xvfb
        run: |
          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 800x600x24 \
            -ac \
            +extension RANDR \
            > xvfb.log 2>&1 &

          echo $! > xvfb.pid

          sleep 3

          if ! kill -0 "$(cat xvfb.pid)" 2>/dev/null; then
            cat xvfb.log
            exit 1
          fi

      - name: Iniciar Fluxbox
        run: |
          export DISPLAY=:99

          fluxbox \
            > fluxbox.log 2>&1 &

          echo $! > fluxbox.pid

          sleep 3

      - name: Iniciar Android 2.3
        run: |
          export DISPLAY=:99

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          export PATH="$JAVA_HOME/bin:$HOME/android-sdk/emulator:$HOME/android-sdk/platform-tools:$PATH"

          emulator \
            -avd Android23 \
            -gpu swiftshader_indirect \
            -memory 1024 \
            -cores 2 \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            > emulator.log 2>&1 &

          echo $! > emulator.pid

          sleep 30

          if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then
            echo "Emulador encerrou."
            cat emulator.log
            exit 1
          fi

          adb wait-for-device

          echo "=== ANDROID ==="

          adb shell getprop ro.build.version.release || true
          adb shell getprop ro.build.version.sdk || true
          adb shell getprop ro.product.cpu.abi || true

          echo "=== ADB ==="

          adb devices

      - name: Iniciar VNC
        run: |
          export DISPLAY=:99

          x11vnc \
            -display :99 \
            -rfbport 5901 \
            -forever \
            -shared \
            -nopw \
            -xkb \
            > vnc.log 2>&1 &

          echo $! > vnc.pid

          sleep 5

          if ! kill -0 "$(cat vnc.pid)" 2>/dev/null; then
            echo "VNC encerrou."
            cat vnc.log
            exit 1
          fi

          echo "=== VNC ==="

          ss -lntp | grep 5901 || true

      - name: Instalar Bore
        run: |
          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz \
            -o bore.tar.gz

          tar -xzf bore.tar.gz

          chmod +x bore

          sudo mv bore /usr/local/bin/bore

          bore --version

      - name: Expor VNC
        run: |
          bore local 5901 \
            --to bore.pub \
            --port 5901 \
            > bore.log 2>&1 &

          echo $! > bore.pid

          sleep 10

          if ! kill -0 "$(cat bore.pid)" 2>/dev/null; then
            echo "Bore encerrou."
            cat bore.log
            exit 1
          fi

          echo "========================================"
          echo "ANDROID 2.3"
          echo "========================================"
          echo "VNC: bore.pub:5901"
          echo "========================================"

          cat bore.log

      - name: Manter execução
        run: |
          for i in $(seq 1 540); do

            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then
              echo "Emulador encerrou."
              cat emulator.log
              exit 1
            fi

            if ! kill -0 "$(cat vnc.pid)" 2>/dev/null; then
              echo "VNC encerrou."
              cat vnc.log
              exit 1
            fi

            if ! kill -0 "$(cat bore.pid)" 2>/dev/null; then
              echo "Bore encerrou."
              cat bore.log
              exit 1
            fi

            sleep 10
          done

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-2.3-logs
          path: |
            emulator.log
            vnc.log
            bore.log
            xvfb.log
            fluxbox.log
          retention-days: 7
