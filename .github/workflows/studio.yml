name: Android 2.3 Nexus S VNC noVNC Bore

on:
  workflow_dispatch:

jobs:
  android23:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      - name: Instalar dependências
        run: |
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openjdk-17-jdk \
            wget \
            unzip \
            curl \
            xvfb \
            x11vnc \
            fluxbox \
            qemu-kvm \
            libvirt-daemon-system \
            libpulse0 \
            libnss3 \
            libx11-6 \
            libxcomposite1 \
            libxcursor1 \
            libxi6 \
            libxrandr2 \
            libxtst6 \
            libglu1-mesa \
            novnc \
            websockify

          java -version

      - name: Configurar KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "/dev/kvm não existe."
            exit 1
          fi

          sudo groupadd -f kvm
          sudo chown root:kvm /dev/kvm || true
          sudo chmod 666 /dev/kvm

          ls -l /dev/kvm

      - name: Instalar Android SDK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$PATH"

          mkdir -p "$HOME/android-sdk/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O sdk.zip

          rm -rf "$HOME/android-sdk/cmdline-tools/latest"

          unzip -q sdk.zip \
            -d "$HOME/android-sdk/cmdline-tools"

          mv \
            "$HOME/android-sdk/cmdline-tools/cmdline-tools" \
            "$HOME/android-sdk/cmdline-tools/latest"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/emulator" >> "$GITHUB_PATH"

      - name: Instalar ferramentas Android
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "emulator" \
            "system-images;android-10;default;x86"

      - name: Criar AVD Nexus S
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          mkdir -p "$HOME/.android/avd"

          AVD="$HOME/.android/avd/NexusS.avd"

          rm -rf "$AVD"
          rm -f "$HOME/.android/avd/NexusS.ini"

          mkdir -p "$AVD"

          cat > "$HOME/.android/avd/NexusS.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD
          path.rel=avd/NexusS.avd
          target=android-10
          EOF

          cat > "$AVD/config.ini" <<EOF
          AvdId=NexusS
          avd.ini.displayname=Nexus S
          avd.ini.encoding=UTF-8
          PlayStore.enabled=false
          abi.type=x86
          hw.cpu.arch=x86
          hw.cpu.ncore=1
          hw.ramSize=512
          hw.heapSize=48
          hw.keyboard=yes
          hw.mainKeys=no
          hw.dPad=no
          hw.trackBall=no
          hw.gps=yes
          hw.audioInput=yes
          hw.audioOutput=yes
          hw.lcd.width=480
          hw.lcd.height=800
          hw.lcd.density=240
          hw.sdCard=yes
          sdcard.size=2048M
          hw.sensors.orientation=yes
          hw.sensors.proximity=yes
          hw.sensors.magnetic_field=yes
          hw.sensors.accelerometer=yes
          disk.dataPartition.size=1024M
          image.sysdir.1=system-images/android-10/default/x86/
          runtime.network.latency=none
          runtime.network.speed=full
          showDeviceFrame=no
          skin.dynamic=no
          tag.display=default
          vm.heapSize=48
          EOF

          cat "$AVD/config.ini"

      - name: Criar SD card
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"
          export PATH="$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          emulator \
            -avd NexusS \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -wipe-data \
            -verbose \
            > sdcard-init.log 2>&1 &

          EMU_PID=$!

          sleep 20

          adb wait-for-device || true

          adb shell 'ls -la /sdcard' || true

          kill "$EMU_PID" 2>/dev/null || true
          pkill -f "emulator.*NexusS" 2>/dev/null || true

          sleep 3

      - name: Iniciar Xvfb
        run: |
          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 800x800x24 \
            -ac \
            +extension RANDR \
            > xvfb.log 2>&1 &

          echo $! > xvfb.pid

          sleep 3

          kill -0 "$(cat xvfb.pid)"

      - name: Iniciar Fluxbox
        run: |
          export DISPLAY=:99

          fluxbox \
            > fluxbox.log 2>&1 &

          echo $! > fluxbox.pid

          sleep 3

      - name: Iniciar Android Nexus S
        run: |
          export DISPLAY=:99

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          echo "=== KVM ==="
          ls -l /dev/kvm

          echo "=== INICIANDO ANDROID ==="

          emulator \
            -avd NexusS \
            -gpu swiftshader_indirect \
            -memory 512 \
            -cores 1 \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -skin 480x800 \
            > emulator.log 2>&1 &

          echo $! > emulator.pid

          sleep 30

          if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then
            echo "Emulador encerrou."
            cat emulator.log
            exit 1
          fi

          adb wait-for-device

          echo "=== ANDROID ==="

          adb shell getprop ro.build.version.release || true
          adb shell getprop ro.build.version.sdk || true
          adb shell getprop ro.product.cpu.abi || true
          adb shell getprop ro.product.model || true

          echo "=== ADB ==="

          adb devices

      - name: Iniciar VNC
        run: |
          export DISPLAY=:99

          x11vnc \
            -display :99 \
            -rfbport 5901 \
            -forever \
            -shared \
            -nopw \
            -xkb \
            -noxrecord \
            -noxfixes \
            -noxdamage \
            > vnc.log 2>&1 &

          echo $! > vnc.pid

          sleep 5

          if ! kill -0 "$(cat vnc.pid)" 2>/dev/null; then
            echo "VNC encerrou."
            cat vnc.log
            exit 1
          fi

          ss -lntp | grep 5901 || true

      - name: Iniciar noVNC
        run: |
          export DISPLAY=:99

          websockify \
            --web=/usr/share/novnc \
            6080 \
            localhost:5901 \
            > novnc.log 2>&1 &

          echo $! > novnc.pid

          sleep 5

          if ! kill -0 "$(cat novnc.pid)" 2>/dev/null; then
            echo "noVNC encerrou."
            cat novnc.log
            exit 1
          fi

          ss -lntp | grep 6080 || true

      - name: Instalar Bore
        run: |
          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz \
            -o bore.tar.gz

          tar -xzf bore.tar.gz

          chmod +x bore

          sudo mv bore /usr/local/bin/bore

          bore --version

      - name: Expor noVNC
        run: |
          bore local 6080 \
            --to bore.pub \
            --port 6080 \
            > bore-novnc.log 2>&1 &

          echo $! > bore-novnc.pid

          sleep 10

          if ! kill -0 "$(cat bore-novnc.pid)" 2>/dev/null; then
            echo "Bore noVNC encerrou."
            cat bore-novnc.log
            exit 1
          fi

          echo "======================================"
          echo "ANDROID 2.3 NEXUS S"
          echo "======================================"
          echo "noVNC:"
          echo "http://bore.pub:6080/vnc.html"
          echo
          echo "VNC:"
          echo "bore.pub:5901"
          echo
          echo "ADB:"
          echo "127.0.0.1:5555"
          echo "======================================"

          cat bore-novnc.log

      - name: Manter execução
        run: |
          for i in $(seq 1 540); do

            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then
              echo "Emulador encerrou."
              cat emulator.log
              exit 1
            fi

            if ! kill -0 "$(cat vnc.pid)" 2>/dev/null; then
              echo "VNC encerrou."
              cat vnc.log
              exit 1
            fi

            if ! kill -0 "$(cat novnc.pid)" 2>/dev/null; then
              echo "noVNC encerrou."
              cat novnc.log
              exit 1
            fi

            if ! kill -0 "$(cat bore-novnc.pid)" 2>/dev/null; then
              echo "Bore encerrou."
              cat bore-novnc.log
              exit 1
            fi

            sleep 10
          done

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-2.3-NexusS-logs
          path: |
            emulator.log
            vnc.log
            novnc.log
            bore-novnc.log
            xvfb.log
            fluxbox.log
            sdcard-init.log
          retention-days: 7
