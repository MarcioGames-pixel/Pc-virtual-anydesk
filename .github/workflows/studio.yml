name: Android 2.3 Nexus S VNC noVNC Bore

on:
  workflow_dispatch:

jobs:
  android23:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependências
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            openjdk-17-jdk \
            wget \
            unzip \
            curl \
            xvfb \
            x11vnc \
            fluxbox \
            qemu-kvm \
            qemu-utils \
            python3 \
            git

      - name: Configurar KVM
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Instalar Android SDK
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64

          mkdir -p "$HOME/android-sdk/cmdline-tools"

          cd /tmp

          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O sdk.zip

          unzip -q sdk.zip \
            -d "$HOME/android-sdk/cmdline-tools"

          mv \
            "$HOME/android-sdk/cmdline-tools/cmdline-tools" \
            "$HOME/android-sdk/cmdline-tools/latest"

          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"

          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/emulator" >> "$GITHUB_PATH"

      - name: Instalar Android 2.3
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export PATH="$JAVA_HOME/bin:$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "emulator" \
            "system-images;android-10;default;x86"

      - name: Criar SD Card
        run: |
          qemu-img create \
            -f raw \
            sdcard.img \
            2G

          ls -lh sdcard.img

      - name: Criar AVD Nexus S
        run: |
          mkdir -p "$HOME/.android/avd"

          AVD="$HOME/.android/avd/NexusS.avd"

          rm -rf "$AVD"
          rm -f "$HOME/.android/avd/NexusS.ini"

          mkdir -p "$AVD"

          cat > "$HOME/.android/avd/NexusS.ini" <<EOF
          avd.ini.encoding=UTF-8
          path=$AVD
          path.rel=avd/NexusS.avd
          target=android-10
          EOF

          cat > "$AVD/config.ini" <<EOF
          AvdId=NexusS
          avd.ini.displayname=Nexus S
          avd.ini.encoding=UTF-8
          PlayStore.enabled=false

          abi.type=x86
          hw.cpu.arch=x86
          hw.cpu.ncore=1

          hw.ramSize=512
          hw.heapSize=48

          hw.keyboard=yes
          hw.mainKeys=no
          hw.dPad=no
          hw.trackBall=no

          hw.gps=yes
          hw.audioInput=yes
          hw.audioOutput=yes

          hw.lcd.width=480
          hw.lcd.height=800
          hw.lcd.density=240

          hw.sdCard=yes
          sdcard.size=2048M

          hw.sensors.orientation=yes
          hw.sensors.proximity=yes
          hw.sensors.magnetic_field=yes
          hw.sensors.accelerometer=yes

          disk.dataPartition.size=1024M

          image.sysdir.1=system-images/android-10/default/x86/

          runtime.network.latency=none
          runtime.network.speed=full

          showDeviceFrame=no
          skin.dynamic=no
          skin.name=WVGA800

          tag.display=default

          vm.heapSize=48
          EOF

      - name: Xvfb
        run: |
          export DISPLAY=:99

          Xvfb :99 \
            -screen 0 480x800x24 \
            -ac \
            +extension RANDR \
            > xvfb.log 2>&1 &

          echo $! > xvfb.pid

          sleep 3

      - name: Fluxbox
        run: |
          export DISPLAY=:99

          fluxbox \
            > fluxbox.log 2>&1 &

          echo $! > fluxbox.pid

          sleep 3

      - name: Iniciar Android 2.3 Nexus S
        run: |
          export DISPLAY=:99

          export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
          export ANDROID_HOME="$HOME/android-sdk"
          export ANDROID_SDK_ROOT="$HOME/android-sdk"

          export PATH="$JAVA_HOME/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$PATH"

          emulator \
            -avd NexusS \
            -gpu swiftshader_indirect \
            -memory 512 \
            -cores 1 \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            > emulator.log 2>&1 &

          echo $! > emulator.pid

          sleep 30

          if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then
            cat emulator.log
            exit 1
          fi

          adb wait-for-device

          echo "=== ANDROID ==="

          adb shell getprop ro.build.version.release || true
          adb shell getprop ro.build.version.sdk || true
          adb shell getprop ro.product.cpu.abi || true
          adb shell getprop ro.product.model || true

          echo "=== ADB ==="

          adb devices

      - name: VNC
        run: |
          export DISPLAY=:99

          x11vnc \
            -display :99 \
            -rfbport 5901 \
            -forever \
            -shared \
            -nopw \
            -xkb \
            > vnc.log 2>&1 &

          echo $! > vnc.pid

          sleep 5

      - name: Instalar noVNC
        run: |
          git clone --depth 1 \
            https://github.com/novnc/noVNC.git \
            novnc

          chmod +x novnc/utils/novnc_proxy

      - name: Iniciar noVNC
        run: |
          nohup ./novnc/utils/novnc_proxy \
            --vnc localhost:5901 \
            --listen 6080 \
            > novnc.log 2>&1 &

          echo $! > novnc.pid

          sleep 5

          if ! kill -0 "$(cat novnc.pid)" 2>/dev/null; then
            cat novnc.log
            exit 1
          fi

      - name: Instalar Bore
        run: |
          curl -fL \
            --retry 5 \
            --retry-delay 3 \
            https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz \
            -o bore.tar.gz

          tar -xzf bore.tar.gz

          chmod +x bore

          sudo mv bore /usr/local/bin/bore

          bore --version

      - name: Expor noVNC
        run: |
          nohup bore local 6080 \
            --to bore.pub \
            --port 6080 \
            > bore-novnc.log 2>&1 &

          echo $! > bore-novnc.pid

          sleep 10

          if ! kill -0 "$(cat bore-novnc.pid)" 2>/dev/null; then
            cat bore-novnc.log
            exit 1
          fi

          echo "======================================"
          echo "ANDROID 2.3 - NEXUS S"
          echo "======================================"
          echo
          echo "noVNC:"
          echo "http://bore.pub:6080/vnc.html"
          echo
          echo "VNC:"
          echo "bore.pub:5901"
          echo
          echo "SD CARD:"
          ls -lh sdcard.img
          echo
          echo "======================================"

          cat bore-novnc.log

      - name: Manter execução
        run: |
          for i in $(seq 1 540); do

            if ! kill -0 "$(cat emulator.pid)" 2>/dev/null; then
              cat emulator.log
              exit 1
            fi

            if ! kill -0 "$(cat vnc.pid)" 2>/dev/null; then
              cat vnc.log
              exit 1
            fi

            if ! kill -0 "$(cat novnc.pid)" 2>/dev/null; then
              cat novnc.log
              exit 1
            fi

            if ! kill -0 "$(cat bore-novnc.pid)" 2>/dev/null; then
              cat bore-novnc.log
              exit 1
            fi

            sleep 10
          done

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-2.3-NexusS-logs
          path: |
            emulator.log
            vnc.log
            novnc.log
            bore-novnc.log
            xvfb.log
            fluxbox.log
          retention-days: 7

      - name: SD Card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-2.3-NexusS-sdcard
          path: sdcard.img
          retention-days: 7
