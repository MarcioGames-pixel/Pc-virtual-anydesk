name: Android-x86 4.0 r1 VNC noVNC Bore

on:
  workflow_dispatch:

jobs:
  android-x86:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Dependencias
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            wget \
            curl \
            pulseaudio \
            pulseaudio-utils \
            python3 \
            python3-websockify \
            novnc

      - name: Verificar KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: Iniciar PulseAudio
        run: |
          export XDG_RUNTIME_DIR=/tmp/runtime-runner
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          pulseaudio --kill || true

          pulseaudio \
            --daemonize=yes \
            --exit-idle-time=-1 \
            --load="module-native-protocol-tcp auth-anonymous=1"

          sleep 5

          export PULSE_SERVER=127.0.0.1

          pactl info

      - name: Baixar QCOW2
        run: |
          wget -O android40.qcow2 \
            http://bore.pub:5000/android40.qcow2

          ls -lh android40.qcow2
          qemu-img info android40.qcow2

      - name: Iniciar QEMU
        run: |
          export PULSE_SERVER=127.0.0.1
          export QEMU_AUDIO_DRV=pa

          nohup qemu-system-i386 \
            -M pc \
            -cpu core2duo \
            -smp 2 \
            -m 2048M \
            -device usb-ehci \
            -device usb-tablet \
            -device usb-kbd \
            -vga vmware \
            -device pcnet,netdev=net0 \
            -netdev user,id=net0,dns=8.8.8.8,hostfwd=tcp::5555-:5555 \
            -drive file=android40.qcow2,format=qcow2,l2-cache-size=4M \
            -audiodev pa,id=audio0,server=127.0.0.1,out.mixing-engine=on,out.fixed-settings=on \
            -device AC97,audiodev=audio0 \
            -boot c \
            -vnc :1 \
            -monitor none \
            -name "Android-x86 4.0 r1 Touch" \
            -accel kvm \
            > qemu.log 2>&1 &

          echo $! > qemu.pid

          sleep 15

          cat qemu.log

          kill -0 "$(cat qemu.pid)"

      - name: Iniciar noVNC
        run: |
          nohup websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5901 \
            > novnc.log 2>&1 &

          echo $! > novnc.pid

          sleep 5

          kill -0 "$(cat novnc.pid)"

      - name: Instalar Bore
        run: |
          wget -q \
            https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz \
            -O bore.tar.gz

          tar -xzf bore.tar.gz
          chmod +x bore

          ./bore --version

      - name: Expor noVNC
        run: |
          nohup ./bore \
            local 6080 \
            --to bore.pub \
            --port 6080 \
            > novnc-bore.log 2>&1 &

          echo $! > novnc-bore.pid

          sleep 10

          cat novnc-bore.log

      - name: Expor ADB
        run: |
          nohup ./bore \
            local 5555 \
            --to bore.pub \
            --port 5555 \
            > adb-bore.log 2>&1 &

          echo $! > adb-bore.pid

          sleep 5

          cat adb-bore.log

      - name: Acesso
        run: |
          echo "======================================"
          echo "ANDROID-X86 4.0 r1"
          echo "======================================"
          echo "QCOW2:"
          echo "http://bore.pub:5000/android40.qcow2"
          echo
          echo "noVNC:"
          echo "http://bore.pub:6080/vnc.html"
          echo
          echo "ADB:"
          echo "bore.pub:5555"
          echo "======================================"

          sleep 600

      - name: Finalizar
        if: always()
        run: |
          kill "$(cat qemu.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat novnc.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat novnc-bore.pid 2>/dev/null)" 2>/dev/null || true
          kill "$(cat adb-bore.pid 2>/dev/null)" 2>/dev/null || true
          killall qemu-system-i386 2>/dev/null || true
          killall bore 2>/dev/null || true
          pulseaudio --kill 2>/dev/null || true

      - name: Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-x86-4.0-logs
          path: |
            qemu.log
            novnc.log
            novnc-bore.log
            adb-bore.log
          if-no-files-found: warn
          retention-days: 7
