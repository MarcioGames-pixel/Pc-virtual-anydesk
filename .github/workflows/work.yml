name: Windows Cloud PC - Anydesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 10080

    steps:
      - name: Downloading & Installing Essentials
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/MarcioGames-pixel/Pc-virtual-anydesk/refs/heads/main/Downloads.bat" -OutFile "Downloads.bat"
          cmd /c Downloads.bat

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Start AnyDesk and Get ID
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\AnyDesk\AnyDesk.exe",
            "C:\Program Files\AnyDesk\AnyDesk.exe",
            "C:\ProgramData\chocolatey\lib\anydesk.install\tools\AnyDesk.exe"
          )

          $anydesk = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $anydesk) {
            $command = Get-Command AnyDesk.exe -ErrorAction SilentlyContinue

            if ($command) {
              $anydesk = $command.Source
            }
          }

          if (-not $anydesk) {
            Write-Error "AnyDesk.exe não foi encontrado."
            exit 1
          }

          Write-Host "AnyDesk encontrado em: $anydesk"

          $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue

          if (-not $process) {
            Start-Process -FilePath $anydesk
            Start-Sleep -Seconds 15
          }

          $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue

          if (-not $process) {
            Write-Error "AnyDesk não está executando."
            exit 1
          }

          Write-Host "AnyDesk está executando."

          $id = & $anydesk --get-id 2>$null

          if ($id) {
            Write-Host "========================================"
            Write-Host "AnyDesk ID: $id"
            Write-Host "========================================"
          } else {
            Write-Host "Não foi possível obter o ID pelo comando --get-id."
          }

      - name: Monitor AnyDesk
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\AnyDesk\AnyDesk.exe",
            "C:\Program Files\AnyDesk\AnyDesk.exe",
            "C:\ProgramData\chocolatey\lib\anydesk.install\tools\AnyDesk.exe"
          )

          $anydesk = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $anydesk) {
            $command = Get-Command AnyDesk.exe -ErrorAction SilentlyContinue

            if ($command) {
              $anydesk = $command.Source
            }
          }

          if (-not $anydesk) {
            Write-Error "AnyDesk.exe não foi encontrado."
            exit 1
          }

          $end = (Get-Date).AddDays(7)

          while ((Get-Date) -lt $end) {
            $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue

            if (-not $process) {
              Write-Host "AnyDesk não está rodando. Reiniciando..."

              Start-Process -FilePath $anydesk

              Start-Sleep -Seconds 15

              $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue

              if (-not $process) {
                Write-Host "Não foi possível iniciar o AnyDesk."
              }
            }

            Write-Host "AnyDesk ativo: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"

            Start-Sleep -Seconds 300
          }

      - name: Clean Up Temporary Files
        if: always()
        shell: powershell
        run: |
          if (Test-Path "Downloads.bat") {
            Remove-Item "Downloads.bat" -Force
          }

          Write-Host "Limpeza completa."
