name: Windows Cloud PC - Anydesk (Optimized)

on:
  workflow_dispatch:

jobs:
  build:
    name: Start Building...
    runs-on: windows-latest
    timeout-minutes: 10080

    steps:
      - name: Downloading & Installing Essentials
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/MarcioGames-pixel/Pc-virtual-anydesk/refs/heads/main/Downloads.bat" -OutFile "Downloads.bat"

          cmd /c Downloads.bat

          if ($LASTEXITCODE -ne 0) {
            Write-Error "Downloads.bat terminou com erro."
            exit $LASTEXITCODE
          }

      - name: Configure AnyDesk
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\AnyDesk\AnyDesk.exe",
            "C:\Program Files\AnyDesk\AnyDesk.exe",
            "C:\ProgramData\chocolatey\lib\anydesk.install\tools\AnyDesk.exe"
          )

          $anydesk = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $anydesk) {
            $command = Get-Command AnyDesk.exe -ErrorAction SilentlyContinue

            if ($command) {
              $anydesk = $command.Source
            }
          }

          if (-not $anydesk) {
            Write-Error "AnyDesk.exe não foi encontrado."
            exit 1
          }

          Write-Host "AnyDesk encontrado em: $anydesk"

          $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue

          if (-not $process) {
            Start-Process -FilePath $anydesk
            Start-Sleep -Seconds 15
          }

          $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue

          if (-not $process) {
            Write-Error "AnyDesk não está executando."
            exit 1
          }

          $password = "testwin1!"

          Write-Host "Configurando acesso não supervisionado..."

          $result = cmd.exe /c "echo $password|`"$anydesk`" --set-password" 2>&1

          Write-Host $result

          if ($LASTEXITCODE -eq 0) {
            Write-Host "Senha de acesso não supervisionado configurada."
          } else {
            Write-Warning "Não foi possível configurar a senha."
          }

          Start-Sleep -Seconds 5

      - name: Get AnyDesk ID
        shell: powershell
        run: |
          $configPaths = @(
            "$env:APPDATA\AnyDesk\service.conf",
            "$env:APPDATA\AnyDesk\ad.trace",
            "$env:PROGRAMDATA\AnyDesk\service.conf",
            "$env:PROGRAMDATA\AnyDesk\system.conf"
          )

          $found = $false

          foreach ($file in $configPaths) {
            if (Test-Path $file) {
              Write-Host "Verificando: $file"

              $content = Get-Content $file -Raw -ErrorAction SilentlyContinue

              if ($content -match "(?i)(?:ad\.anynet\.id|anynet\.id|client_id)\s*[=:]\s*([0-9]+)") {
                $id = $Matches[1]

                Write-Host "========================================"
                Write-Host "AnyDesk ID: $id"
                Write-Host "========================================"

                $found = $true
                break
              }
            }
          }

          if (-not $found) {
            Write-Host "Arquivos de configuração encontrados:"
            
            foreach ($file in $configPaths) {
              if (Test-Path $file) {
                Write-Host $file
              }
            }

            Write-Warning "O ID ainda não foi encontrado."
          }

      - name: Verify AnyDesk
        shell: powershell
        run: |
          $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue

          if (-not $process) {
            Write-Error "AnyDesk não está executando."
            exit 1
          }

          Write-Host "AnyDesk está executando."

      - name: Monitor AnyDesk
        shell: powershell
        run: |
          $paths = @(
            "C:\Program Files (x86)\AnyDesk\AnyDesk.exe",
            "C:\Program Files\AnyDesk\AnyDesk.exe",
            "C:\ProgramData\chocolatey\lib\anydesk.install\tools\AnyDesk.exe"
          )

          $anydesk = $paths |
            Where-Object { Test-Path $_ } |
            Select-Object -First 1

          if (-not $anydesk) {
            Write-Error "AnyDesk.exe não foi encontrado."
            exit 1
          }

          $end = (Get-Date).AddDays(7)

          while ((Get-Date) -lt $end) {
            $process = Get-Process -Name "AnyDesk" -ErrorAction SilentlyContinue

            if (-not $process) {
              Write-Host "AnyDesk não está rodando. Reiniciando..."

              Start-Process -FilePath $anydesk

              Start-Sleep -Seconds 15
            }

            Write-Host "AnyDesk ativo: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')"

            Start-Sleep -Seconds 300
          }

      - name: Clean Up Temporary Files
        if: always()
        shell: powershell
        run: |
          if (Test-Path "Downloads.bat") {
            Remove-Item "Downloads.bat" -Force
          }

          Write-Host "Limpeza completa."
