name: Android-x86 4.3 VNC noVNC ADB

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  android-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependências
        run: |
          sudo apt update
          sudo apt install -y \
            qemu-system-x86 \
            qemu-utils \
            wget \
            curl \
            pulseaudio \
            pulseaudio-utils \
            novnc \
            websockify

      - name: Recuperar QCOW2 anterior
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PREVIOUS_RUN=$(gh run list \
            --repo "${{ github.repository }}" \
            --workflow "${{ github.workflow }}" \
            --status completed \
            --limit 10 \
            --json databaseId \
            --jq '.[0].databaseId')

          if [ -n "$PREVIOUS_RUN" ]; then
            echo "Execução anterior: $PREVIOUS_RUN"

            mkdir -p previous

            if gh run download "$PREVIOUS_RUN" \
              --repo "${{ github.repository }}" \
              --name Android-x86-4.3-QCOW2 \
              --dir previous; then

              if [ -f previous/android43-installed.qcow2 ]; then
                mv previous/android43-installed.qcow2 android43.qcow2
                echo "QCOW2 anterior recuperado."
                qemu-img info android43.qcow2
              else
                echo "QCOW2 não encontrado."
                qemu-img create -f qcow2 android43.qcow2 20G
              fi
            else
              echo "Artifact anterior não encontrado."
              qemu-img create -f qcow2 android43.qcow2 20G
            fi
          else
            echo "Nenhuma execução anterior encontrada."
            qemu-img create -f qcow2 android43.qcow2 20G
          fi

      - name: KVM
        run: |
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - name: PulseAudio
        run: |
          export XDG_RUNTIME_DIR=/tmp/runtime-runner
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          pulseaudio --kill || true

          pulseaudio \
            --daemonize=yes \
            --exit-idle-time=-1 \
            --load="module-native-protocol-tcp auth-anonymous=1"

          sleep 5

          export PULSE_SERVER=127.0.0.1

          pactl info

      - name: Android-x86 4.3
        run: |
          wget -O android-x86-4.3.iso \
            https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/android-x86/android-x86-4.3-20130725.iso

      - name: QEMU
        run: |
          export PULSE_SERVER=127.0.0.1

          nohup qemu-system-i386 \
            -M pc,acpi=on \
            -cpu core2duo \
            -accel kvm \
            -smp 2 \
            -m 2048M \
            -device usb-ehci \
            -device usb-tablet \
            -device usb-kbd \
            -vga vmware \
            -device rtl8139,netdev=net0 \
            -netdev user,id=net0,dns=8.8.8.8,hostfwd=tcp::5555-:5555 \
            -audiodev pa,id=audio0,server=127.0.0.1 \
            -device ES1370,audiodev=audio0 \
            -drive file=android43.qcow2,format=qcow2 \
            -cdrom android-x86-4.3.iso \
            -boot d \
            -vnc :1 \
            -monitor none \
            -name "Android-x86 4.3 Touch" \
            > qemu.log 2>&1 &

          echo $! > qemu.pid

          sleep 15

          cat qemu.log

          kill -0 "$(cat qemu.pid)"

      - name: Bore
        run: |
          wget -q \
            https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz

          tar -xf bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore

      - name: ADB 5555
        run: |
          nohup ./bore \
            local 5555 \
            --to bore.pub \
            --port 5555 \
            > adb-bore.log 2>&1 &

      - name: VNC 5901
        run: |
          nohup ./bore \
            local 5901 \
            --to bore.pub \
            --port 5901 \
            > vnc-bore.log 2>&1 &

      - name: noVNC
        run: |
          nohup websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5901 \
            > novnc.log 2>&1 &

          echo $! > novnc.pid

          sleep 5

          kill -0 "$(cat novnc.pid)"

      - name: Bore noVNC 6080
        run: |
          nohup ./bore \
            local 6080 \
            --to bore.pub \
            --port 6080 \
            > novnc-bore.log 2>&1 &

          sleep 10

          echo "ADB: adb connect bore.pub:5555"
          echo "VNC: bore.pub:5901"
          echo "noVNC: http://bore.pub:6080/vnc.html"

      - name: Instalação manual
        run: |
          sleep 21495

      - name: Finalizar
        if: always()
        run: |
          killall qemu-system-i386 || true
          killall bore || true
          pulseaudio --kill || true

      - name: Compactar QCOW2
        if: always()
        run: |
          if [ -f android43.qcow2 ]; then
            qemu-img convert \
              -O qcow2 \
              -c \
              android43.qcow2 \
              android43-installed.qcow2
          fi

      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-x86-4.3-QCOW2
          path: android43-installed.qcow2
          retention-days: 7
