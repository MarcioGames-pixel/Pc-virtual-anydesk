name: Android-x86 4.3 KVM VNC ADB

on:
workflow_dispatch:

jobs:
android-x86:
runs-on: ubuntu-latest
timeout-minutes: 120

steps:
  - name: Instalar dependências
    run: |
      sudo apt update
      sudo apt install -y \
        qemu-system-x86 \
        qemu-utils \
        wget \
        pulseaudio \
        pulseaudio-utils

  - name: Verificar KVM
    run: |
      if [ ! -e /dev/kvm ]; then
        echo "KVM não disponível"
        exit 1
      fi
      sudo chmod 666 /dev/kvm

  - name: Iniciar PulseAudio
    run: |
      pulseaudio --kill || true
      pulseaudio \
        --daemonize=yes \
        --exit-idle-time=-1 \
        --system=false \
        --disallow-exit
      sleep 3
      pactl info

  - name: Baixar Android-x86 4.3
    run: |
      wget -O android-x86-4.3.iso \
        https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/android-x86/android-x86-4.3-20130725.iso

  - name: Criar QCOW2
    run: |
      qemu-img create -f qcow2 android43.qcow2 20G

  - name: Iniciar Android-x86
    run: |
      export PULSE_SERVER=127.0.0.1
      export QEMU_AUDIO_DRV=pa

      nohup qemu-system-x86_64 \
        -M pc,acpi=on \
        -cpu host \
        -accel kvm \
        -smp 4 \
        -m 2048M \
        -device qemu-xhci \
        -device usb-tablet \
        -device usb-kbd \
        -vga vmware \
        -audiodev pa,id=audio0,server=127.0.0.1,out.mixing-engine=on,out.fixed-settings=on \
        -device ES1370,audiodev=audio0 \
        -device rtl8139,netdev=net0 \
        -netdev user,id=net0,dns=8.8.8.8,hostfwd=tcp::5555-:5555 \
        -drive file=android43.qcow2,format=qcow2 \
        -cdrom android-x86-4.3.iso \
        -boot d \
        -vnc :1 \
        -monitor none \
        -name "Android-x86 4.3 Touch" \
        > qemu.log 2>&1 &

      echo $! > qemu.pid
      sleep 10
      cat qemu.log || true

  - name: Instalar Bore
    run: |
      wget -q \
        https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
      tar -xf bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
      chmod +x bore

  - name: Abrir ADB e VNC
    run: |
      nohup ./bore \
        local 5555 \
        --to bore.pub \
        --port 5555 \
        > adb-bore.log 2>&1 &

      nohup ./bore \
        local 5901 \
        --to bore.pub \
        --port 5901 \
        > vnc-bore.log 2>&1 &

      sleep 10

      echo "===== ADB ====="
      cat adb-bore.log || true

      echo "===== VNC ====="
      cat vnc-bore.log || true

  - name: Aguardar instalação
    run: |
      echo "ADB: bore.pub:5555"
      echo "VNC: bore.pub:5901"
      sleep 600

  - name: Desligar QEMU
    if: always()
    run: |
      killall qemu-system-x86_64 || true
      killall bore || true

  - name: Verificar QCOW2
    if: always()
    run: |
      qemu-img check android43.qcow2 || true
      qemu-img info android43.qcow2

  - name: Compactar QCOW2
    if: always()
    run: |
      qemu-img convert \
        -O qcow2 \
        -c \
        android43.qcow2 \
        android43-installed-20GB.qcow2

      ls -lh android43-installed-20GB.qcow2

  - name: Publicar QCOW2
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: Android-x86-4.3-20GB-installed
      path: android43-installed-20GB.qcow2
      retention-days: 7
      overwrite: true

  - name: Publicar logs
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: Android-x86-4.3-logs
      path: |
        qemu.log
        adb-bore.log
        vnc-bore.log
      retention-days: 7
      overwrite: true
