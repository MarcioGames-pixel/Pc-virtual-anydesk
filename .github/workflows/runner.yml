name: Android-x86 4.3 Manual Install KVM VNC

on:
  workflow_dispatch:

jobs:
  android-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:

      - name: Instalar dependências
        run: |
          sudo apt update
          sudo apt install -y \
            qemu-system-x86 \
            qemu-utils \
            wget

      - name: Verificar KVM
        run: |
          if [ -e /dev/kvm ]; then
            echo "KVM encontrado"
            sudo chmod 666 /dev/kvm
          else
            echo "KVM não disponível"
            exit 1
          fi

      - name: Baixar Android-x86 4.3
        run: |
          wget -O android-x86-4.3.iso \
          https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/android-x86/android-x86-4.3-20130725.iso

          ls -lh android-x86-4.3.iso

      - name: Criar QCOW2 20GB
        run: |
          qemu-img create \
            -f qcow2 \
            android43.qcow2 \
            20G

      - name: Iniciar Android-x86 no VNC
        run: |
          nohup qemu-system-x86_64 \
            -M q35 \
            -cpu host \
            -enable-kvm \
            -smp 4 \
            -m 2048M \
            -device qemu-xhci \
            -device usb-tablet \
            -device usb-kbd \
            -vga vmware \
            -device ich9-intel-hda \
            -device hda-duplex \
            -device e1000e,netdev=net0 \
            -netdev user,id=net0,dns=8.8.8.8 \
            -drive file=android43.qcow2,format=qcow2 \
            -cdrom android-x86-4.3.iso \
            -boot d \
            -vnc :1 \
            -monitor none \
            -name "Android-x86 4.3" \
            > qemu.log 2>&1 &

          sleep 10

          echo "===== QEMU ====="
          cat qemu.log || true

      - name: Instalar Bore
        run: |
          wget -q \
          https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz

          tar -xf bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore

      - name: Abrir VNC público
        run: |
          nohup ./bore \
            local 5901 \
            --to bore.pub \
            > bore.log 2>&1 &

          sleep 10

          echo "===== CONEXÃO VNC ====="
          cat bore.log

      - name: Aguardar instalação manual
        run: |
          echo "======================================"
          echo "Instale o Android-x86 pelo VNC agora"
          echo "Quando terminar, feche o QEMU"
          echo "======================================"

          sleep 6600

      - name: Desligar QEMU
        run: |
          killall qemu-system-x86_64 || true
          killall bore || true

      - name: Compactar QCOW2
        run: |
          qemu-img convert \
            -O qcow2 \
            -c \
            android43.qcow2 \
            android43-installed-20GB.qcow2

          ls -lh android43-installed-20GB.qcow2

      - name: Publicar Android QCOW2
        uses: actions/upload-artifact@v4
        with:
          name: Android-x86-4.3-20GB-installed
          path: android43-installed-20GB.qcow2
          retention-days: 7
