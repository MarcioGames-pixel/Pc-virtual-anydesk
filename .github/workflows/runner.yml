name: Android-x86 4.3 KVM VNC ADB

on:
  workflow_dispatch:

jobs:
  android-x86:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Instalar dependências
        run: |
          sudo apt update
          sudo apt install -y \
            qemu-system-x86 \
            qemu-utils \
            wget \
            pulseaudio \
            pulseaudio-utils

      - name: Verificar KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "KVM não disponível"
            exit 1
          fi

          sudo chmod 666 /dev/kvm

      - name: Configurar PulseAudio
        run: |
          export XDG_RUNTIME_DIR=/tmp/runtime-runner
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          pulseaudio --kill || true

          pulseaudio \
            --daemonize=yes \
            --system=false \
            --exit-idle-time=-1 \
            --load="module-native-protocol-tcp auth-anonymous=1" \
            --load="module-null-sink sink_name=qemu_sink" \
            --log-target=stderr

          sleep 5

          export PULSE_SERVER=127.0.0.1

          pactl info
          pactl list short sinks

      - name: Baixar Android-x86 4.3
        run: |
          wget -O android-x86-4.3.iso \
            https://storage.googleapis.com/google-code-archive-downloads/v2/code.google.com/android-x86/android-x86-4.3-20130725.iso

      - name: Criar QCOW2
        run: |
          qemu-img create \
            -f qcow2 \
            android43.qcow2 \
            20G

      - name: Iniciar Android-x86
        run: |
          export PULSE_SERVER=127.0.0.1

          nohup qemu-system-i386 \
            -M pc,acpi=on \
            -cpu core2duo \
            -accel kvm \
            -smp 2 \
            -m 2048M \
            -device usb-ehci \
            -device usb-tablet \
            -device usb-kbd \
            -vga vmware \
            -device rtl8139,netdev=net0 \
            -netdev user,id=net0,dns=8.8.8.8,hostfwd=tcp::5555-:5555 \
            -audiodev pa,id=audio0,server=127.0.0.1 \
            -device ES1370,audiodev=audio0 \
            -drive file=android43.qcow2,format=qcow2 \
            -cdrom android-x86-4.3.iso \
            -boot d \
            -vnc :1 \
            -monitor none \
            -name "Android-x86 4.3 Touch" \
            > qemu.log 2>&1 &

          echo $! > qemu.pid

          sleep 10

          echo "===== QEMU LOG ====="
          cat qemu.log || true

          if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
            echo "QEMU encerrou inesperadamente"
            exit 1
          fi

      - name: Instalar Bore
        run: |
          wget -q \
            https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz

          tar -xf bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz

          chmod +x bore

      - name: Abrir ADB e VNC
        run: |
          nohup ./bore \
            local 5555 \
            --to bore.pub \
            --port 5555 \
            > adb-bore.log 2>&1 &

          nohup ./bore \
            local 5901 \
            --to bore.pub \
            --port 5901 \
            > vnc-bore.log 2>&1 &

          sleep 10

          echo "===== ADB ====="
          cat adb-bore.log || true

          echo "===== VNC ====="
          cat vnc-bore.log || true

          echo "ADB: bore.pub:5555"
          echo "VNC: bore.pub:5901"

      - name: Aguardar instalação
        run: |
          sleep 600

      - name: Desligar
        if: always()
        run: |
          killall qemu-system-i386 || true
          killall bore || true
          pulseaudio --kill || true

      - name: Verificar QCOW2
        if: always()
        run: |
          if [ -f android43.qcow2 ]; then
            qemu-img check android43.qcow2 || true
            qemu-img info android43.qcow2
          fi

      - name: Compactar QCOW2
        if: always()
        run: |
          if [ -f android43.qcow2 ]; then
            qemu-img convert \
              -O qcow2 \
              -c \
              android43.qcow2 \
              android43-installed-20GB.qcow2

            ls -lh android43-installed-20GB.qcow2
          fi

      - name: Publicar QCOW2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-x86-4.3-20GB-installed
          path: android43-installed-20GB.qcow2
          retention-days: 7
          overwrite: true

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android-x86-4.3-logs
          path: |
            qemu.log
            adb-bore.log
            vnc-bore.log
          retention-days: 7
          overwrite: true
