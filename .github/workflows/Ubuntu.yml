name: Wine + noVNC + Bore

on:
  workflow_dispatch:

jobs:
  wine-desktop:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Update Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get upgrade -y

      - name: Enable 32-bit architecture
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

      - name: Install Wine 32/64 + desktop
        run: |
          sudo apt-get install -y \
            wine \
            wine32 \
            wine64 \
            xfce4 \
            xfce4-goodies \
            tigervnc-standalone-server \
            websockify \
            curl \
            wget \
            unzip \
            p7zip-full \
            git

          echo "=== Wine ==="
          wine --version
          wine64 --version

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf \
            https://sh.rustup.rs | sh -s -- -y

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build Bore
        run: |
          source "$HOME/.cargo/env"

          cargo install bore-cli --version 0.6.0

          echo "=== Bore ==="
          bore --version

      - name: Install latest noVNC
        run: |
          cd "$HOME"

          git clone --depth 1 \
            https://github.com/novnc/noVNC.git \
            novnc

          echo "=== noVNC installed ==="
          ls -la "$HOME/novnc"

      - name: Configure VNC
        run: |
          mkdir -p "$HOME/.vnc"

          cat > "$HOME/.vnc/xstartup" <<'EOF'
          #!/bin/sh

          unset SESSION_MANAGER
          unset DBUS_SESSION_BUS_ADDRESS

          xrdb "$HOME/.Xresources" 2>/dev/null || true

          startxfce4 &
          EOF

          chmod +x "$HOME/.vnc/xstartup"

          printf '123456\n123456\n\n' | vncpasswd

      - name: Start VNC
        run: |
          vncserver :1 \
            -geometry 1280x720 \
            -depth 24 \
            -localhost no

          sleep 5

          echo "=== VNC ==="
          ss -lntp | grep 5901 || true

      - name: Start noVNC
        run: |
          "$HOME/novnc/utils/novnc_proxy" \
            --vnc localhost:5901 \
            --listen 6080 \
            > "$HOME/novnc.log" 2>&1 &

          sleep 5

          echo "=== noVNC ==="
          ss -lntp | grep 6080 || true

          echo "=== noVNC log ==="
          cat "$HOME/novnc.log" || true

      - name: Configure Wine
        run: |
          export DISPLAY=:1

          wineboot --init || true

          sleep 10

          echo "=== Wine prefix ==="
          ls -la "$HOME/.wine" || true

          echo "=== Wine ==="
          wine --version

      - name: Check desktop
        run: |
          export DISPLAY=:1

          echo "=== Processes ==="
          ps aux | grep -E 'xfce|Xvnc|wine' | grep -v grep || true

          echo "=== Ports ==="
          ss -lntp | grep -E '5901|6080' || true

      - name: Start Bore for 5 hours
        run: |
          echo "========================================"
          echo "Starting Bore..."
          echo "========================================"

          END=$((SECONDS + 18000))

          while [ "$SECONDS" -lt "$END" ]; do

            echo ""
            echo "Starting Bore tunnel..."
            echo ""

            bore local 6080 \
              --to bore.pub \
              --port 6080 || true

            if [ "$SECONDS" -ge "$END" ]; then
              break
            fi

            echo ""
            echo "Bore disconnected."
            echo "Retrying in 5 seconds..."
            echo ""

            sleep 5
          done

          echo "========================================"
          echo "5 hours finished."
          echo "========================================"
