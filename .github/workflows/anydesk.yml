
name: Windows XP Gamer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-xp:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      XP_VNC_PASSWORD: ${{ secrets.XP_VNC_PASSWORD }}
      XP_ISO_URL: ${{ secrets.XP_ISO_URL }}

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            wget \
            curl \
            git \
            python3 \
            unzip \
            xz-utils \
            build-essential \
            pkg-config \
            libssl-dev \
            cargo

      - name: Check virtualization
        id: kvm
        run: |
          if [ -e /dev/kvm ] && [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
            echo "KVM available"
            echo "accel=kvm" >> "$GITHUB_OUTPUT"
            echo "cpu=host" >> "$GITHUB_OUTPUT"
          else
            echo "KVM unavailable, using software emulation"
            echo "accel=tcg" >> "$GITHUB_OUTPUT"
            echo "cpu=qemu32" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare workspace
        run: |
          mkdir -p Shared
          rm -f /tmp/qemu-monitor.sock
          echo "Workspace ready."
          df -h .
          free -h

      - name: Download Windows XP SP3 ISO
        run: |
          if [ -z "$XP_ISO_URL" ]; then
            echo "ERROR: XP_ISO_URL secret is missing."
            exit 1
          fi

          curl -fL --retry 3 \
            "$XP_ISO_URL" \
            -o windows-xp.iso

          if [ ! -s windows-xp.iso ]; then
            echo "Windows XP ISO download failed."
            exit 1
          fi

          ls -lh windows-xp.iso

      - name: Create virtual disk
        run: |
          qemu-img create \
            -f qcow2 \
            xp-gamer.qcow2 \
            64G

      - name: Start Windows XP
        run: |
          ACCEL="${{ steps.kvm.outputs.accel }}"
          CPU="${{ steps.kvm.outputs.cpu }}"

          qemu-system-i386 \
            -machine pc,accel="$ACCEL" \
            -cpu "$CPU" \
            -smp 4 \
            -m 4096 \
            -drive file=xp-gamer.qcow2,format=qcow2,if=ide \
            -cdrom windows-xp.iso \
            -boot order=d \
            -vga std \
            -device AC97 \
            -device e1000,netdev=net0 \
            -netdev user,id=net0 \
            -drive file=fat:rw:./Shared,format=raw,if=ide \
            -usb \
            -device usb-tablet \
            -rtc base=localtime \
            -overcommit mem-lock=off \
            -vnc 127.0.0.1:0,password=on \
            -monitor unix:/tmp/qemu-monitor.sock,server=on,wait=off \
            > qemu.log 2>&1 &

          echo $! > qemu.pid

          sleep 5

          if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
            echo "QEMU failed to start."
            cat qemu.log
            exit 1
          fi

          echo "Windows XP QEMU started."

      - name: Configure VNC password
        run: |
          python3 - <<'PY'
          import socket
          import time
          import os

          password = os.environ.get("XP_VNC_PASSWORD", "")
          path = "/tmp/qemu-monitor.sock"

          if not password or len(password) > 8:
              raise SystemExit(
                  "XP_VNC_PASSWORD must contain 1 to 8 characters."
              )

          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          sock.settimeout(15)

          for attempt in range(30):
              try:
                  sock.connect(path)
                  break
              except (FileNotFoundError, ConnectionRefusedError):
                  time.sleep(1)
          else:
              raise SystemExit("QEMU monitor socket unavailable.")

          def read_prompt():
              data = b""

              while b"(qemu)" not in data:
                  chunk = sock.recv(4096)

                  if not chunk:
                      raise RuntimeError("QEMU monitor disconnected.")

                  data += chunk

              return data.decode("utf-8", errors="replace")

          try:
              print("Waiting for QEMU monitor...")
              print(read_prompt())

              print("Setting VNC password...")

              sock.sendall(
                  ("set_password vnc " + password + "\n").encode()
              )

              response = read_prompt()

              print("QEMU response:")
              print(response)

              if "Error" in response or "Could not" in response:
                  raise RuntimeError("QEMU rejected VNC password.")

              print("VNC password command accepted.")

          finally:
              sock.close()
          PY

      - name: Verify VNC
        run: |
          python3 - <<'PY'
          import socket
          import time

          for attempt in range(30):
              try:
                  s = socket.create_connection(
                      ("127.0.0.1", 5900), timeout=3
                  )

                  print("VNC port 5900 is responding.")
                  s.close()
                  break

              except OSError:
                  time.sleep(1)

          else:
              raise SystemExit("VNC port 5900 unavailable.")
          PY

      - name: Install noVNC
        run: |
          git clone --depth 1 \
            https://github.com/novnc/noVNC.git novnc

          git clone --depth 1 \
            https://github.com/novnc/websockify.git \
            novnc/utils/websockify

          chmod +x novnc/utils/novnc_proxy

      - name: Start noVNC
        run: |
          nohup ./novnc/utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 0.0.0.0:6080 \
            > novnc.log 2>&1 &

          echo $! > novnc.pid

          sleep 5

          if ! kill -0 "$(cat novnc.pid)" 2>/dev/null; then
            echo "noVNC failed."
            cat novnc.log
            exit 1
          fi

          echo "noVNC running on port 6080."

      - name: Install Bore
        run: |
          cargo install bore-cli --version 0.6.0

      - name: Start Bore tunnel
        run: |
          nohup "$HOME/.cargo/bin/bore" local 6080 \
            --to bore.pub \
            > bore.log 2>&1 &

          echo $! > bore.pid

          for i in $(seq 1 30); do
            if grep -q "listening at" bore.log; then
              break
            fi

            sleep 2
          done

          echo "Bore output:"
          cat bore.log

          if ! kill -0 "$(cat bore.pid)" 2>/dev/null; then
            echo "Bore failed."
            exit 1
          fi

      - name: Show connection information
        run: |
          echo "================================"
          echo "       WINDOWS XP GAMER"
          echo "================================"
          echo "VNC: 127.0.0.1:5900"
          echo "noVNC: port 6080"
          echo "Password: configured in GitHub Secrets"
          echo "================================"

          cat bore.log

      - name: Keep Windows XP running
        run: |
          echo "Windows XP session started."

          for i in $(seq 1 21000); do
            if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
              echo "QEMU stopped unexpectedly."
              cat qemu.log
              exit 1
            fi

            sleep 1
          done

      - name: Stop virtual machine
        if: always()
        run: |
          for file in qemu.pid novnc.pid bore.pid; do
            if [ -f "$file" ]; then
              kill "$(cat "$file")" 2>/dev/null || true
            fi
          done

      - name: Diagnostic information
        if: always()
        run: |
          echo "===== SYSTEM ====="
          uname -a

          echo "===== FILES ====="
          ls -lah

          echo "===== QEMU LOG ====="
          if [ -f qemu.log ]; then
            cat qemu.log
          else
            echo "qemu.log not created"
          fi

          echo "===== NOVNC LOG ====="
          if [ -f novnc.log ]; then
            cat novnc.log
          else
            echo "novnc.log not created"
          fi

          echo "===== BORE LOG ====="
          if [ -f bore.log ]; then
            cat bore.log
          else
            echo "bore.log not created"
          fi

      - name: Compress Windows XP disk
        if: always()
        run: |
          if [ -f xp-gamer.qcow2 ]; then
            qemu-img convert \
              -O qcow2 \
              -c xp-gamer.qcow2 \
              xp-gamer-compressed.qcow2
          fi

      - name: Upload Windows XP disk
        if: always() && hashFiles('xp-gamer-compressed.qcow2') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Windows-XP-Gamer-Disk
          path: xp-gamer-compressed.qcow2
          retention-days: 7

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-XP-Gamer-Logs
          path: |
            qemu.log
            novnc.log
            bore.log
          if-no-files-found: ignore
          retention-days: 7
