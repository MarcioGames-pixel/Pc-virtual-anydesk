name: Windows XP Gamer KVM

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-kvm \
            qemu-system-x86 \
            qemu-utils \
            wget \
            python3 \
            git \
            curl

      - name: Check KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "KVM não está disponível neste runner."
            exit 1
          fi

          ls -l /dev/kvm

      - name: KVM permissions
        run: |
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm

      - name: Download noVNC
        run: |
          git clone --depth 1 \
            https://github.com/novnc/noVNC.git \
            novnc

      - name: Download Windows XP ISO
        run: |
          wget -O windows-xp.iso \
            "https://archive.org/download/WinXPProSP3x86/en_windows_xp_professional_with_service_pack_3_x86_cd_vl_x14-73974.iso"

      - name: Create QCOW2
        run: |
          qemu-img create \
            -f qcow2 \
            xp-gamer.qcow2 \
            64G

      - name: Create shared folder
        run: |
          mkdir -p Shared

      - name: Start QEMU
        run: |
          VNC_PASSWORD='XPgamer1'

          if [ ${#VNC_PASSWORD} -gt 8 ]; then
            echo "ERRO: senha VNC deve ter no máximo 8 caracteres."
            exit 1
          fi

          nohup qemu-system-i386 \
            -enable-kvm \
            -machine pc,accel=kvm \
            -cpu host \
            -smp 4,sockets=1,cores=4,threads=1 \
            -m 4096 \
            -drive file=xp-gamer.qcow2,format=qcow2,if=ide,cache=writeback \
            -cdrom windows-xp.iso \
            -boot order=d \
            -vga std \
            -device AC97 \
            -device e1000,netdev=net0 \
            -netdev user,id=net0 \
            -drive file=fat:rw:./Shared,format=raw,media=disk \
            -usb \
            -device usb-tablet \
            -rtc base=localtime \
            -overcommit mem-lock=off \
            -vnc 127.0.0.1:0,password=on \
            -monitor unix:/tmp/qemu-monitor.sock,server=on,wait=off \
            > qemu.log 2>&1 &

          echo $! > qemu.pid

          sleep 15

          echo "================ QEMU ================"
          cat qemu.log || true

          if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
            echo "QEMU não está rodando."
            exit 1
          fi

      - name: Set VNC password
        run: |
          python3 - <<'PY'
          import socket

          password = "XPgamer1"

          sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          sock.connect("/tmp/qemu-monitor.sock")

          sock.sendall(
              ("set_password vnc " + password + "\n").encode()
          )

          response = sock.recv(4096).decode(errors="replace")
          print(response)

          sock.close()
          PY

      - name: Verify VNC
        run: |
          echo "================ VNC ================"

          if ss -lnt | grep -q ':5900'; then
            echo "VNC está escutando na porta 5900."
          else
            echo "ERRO: VNC não está escutando."
            exit 1
          fi

      - name: Download Bore
        run: |
          wget -q -O bore.tar.gz \
            https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz

          tar -xzf bore.tar.gz

          chmod +x bore

          ./bore --version

      - name: Start noVNC
        run: |
          nohup ./novnc/utils/novnc_proxy \
            --vnc 127.0.0.1:5900 \
            --listen 0.0.0.0:6080 \
            > novnc.log 2>&1 &

          echo $! > novnc.pid

          sleep 5

          echo "================ noVNC ================"
          cat novnc.log || true

          if ! kill -0 "$(cat novnc.pid)" 2>/dev/null; then
            echo "noVNC não iniciou."
            exit 1
          fi

      - name: Test noVNC
        run: |
          echo "================ HTTP noVNC ================"

          curl -I \
            http://127.0.0.1:6080/vnc.html \
            || true

      - name: Start Bore
        run: |
          nohup ./bore \
            local 6080 \
            --to bore.pub \
            > bore.log 2>&1 &

          echo $! > bore.pid

          sleep 10

          echo "================ Bore ================"
          cat bore.log || true

          echo "======================================="
          echo "Windows XP"
          echo "Senha VNC: XPgamer1"
          echo "======================================="

      - name: Check services
        run: |
          echo "================ PORTS ================"

          ss -lntp | grep -E ':5900|:6080' || true

          echo "================ PROCESSES ================"

          ps aux | grep -E 'qemu|novnc|websockify|bore' \
            | grep -v grep || true

      - name: Keep VM running
        run: |
          echo "VM disponível."

          while kill -0 "$(cat qemu.pid)" 2>/dev/null; do
            sleep 30
          done

          echo "QEMU terminou."

      - name: Show logs
        if: always()
        run: |
          echo "================ QEMU LOG ================"
          cat qemu.log || true

          echo "================ noVNC LOG ================"
          cat novnc.log || true

          echo "================ Bore LOG ================"
          cat bore.log || true

      - name: Finalizar
        if: always()
        run: |
          killall qemu-system-i386 || true
          killall bore || true
          killall websockify || true

      - name: Compactar QCOW2
        if: always()
        run: |
          if [ -f xp-gamer.qcow2 ]; then
            qemu-img convert \
              -O qcow2 \
              -c \
              xp-gamer.qcow2 \
              xp-installed.qcow2
          fi

      - name: Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-XP-QCOW2
          path: xp-installed.qcow2
          retention-days: 7
