name: Windows XP Gamer KVM

on:
  workflow_dispatch:

jobs:
  vm:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-kvm \
            qemu-system-x86 \
            qemu-utils \
            novnc \
            websockify \
            wget \
            python3

      - name: Check KVM
        run: |
          if [ ! -e /dev/kvm ]; then
            echo "KVM não está disponível neste runner."
            exit 1
          fi

          ls -l /dev/kvm

      - name: Download Windows XP ISO
        run: |
          wget -O windows-xp.iso \
            "https://archive.org/download/WinXPProSP3x86/en_windows_xp_professional_with_service_pack_3_x86_cd_vl_x14-73974.iso"

      - name: Create QCOW2
        run: |
          qemu-img create \
            -f qcow2 \
            xp-gamer.qcow2 \
            64G

      - name: Create shared folder
        run: |
          mkdir -p Shared

      - name: Start QEMU
        run: |
          nohup qemu-system-i386 \
            -enable-kvm \
            -machine pc,accel=kvm \
            -cpu host \
            -smp 4,sockets=1,cores=4,threads=1 \
            -m 4096 \
            -drive file=xp-gamer.qcow2,format=qcow2,if=ide,cache=writeback \
            -cdrom windows-xp.iso \
            -boot order=d \
            -vga std \
            -device AC97 \
            -device e1000,netdev=net0 \
            -netdev user,id=net0 \
            -drive file=fat:rw:./Shared,format=raw,media=disk \
            -usb \
            -device usb-tablet \
            -rtc base=localtime \
            -overcommit mem-lock=off \
            -vnc 127.0.0.1:0 \
            -monitor none \
            > qemu.log 2>&1 &

          echo $! > qemu.pid

      - name: Start noVNC
        run: |
          nohup websockify \
            --web=/usr/share/novnc \
            127.0.0.1:6080 \
            127.0.0.1:5900 \
            > novnc.log 2>&1 &

          echo $! > novnc.pid

      - name: Start Bore
        run: |
          wget -O bore \
            https://github.com/ekzhang/bore/releases/download/v0.6.0/bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz

          tar -xf bore-v0.6.0-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore

          nohup ./bore local 6080 \
            --to bore.pub \
            --port 6080 \
            > bore.log 2>&1 &

          echo $! > bore.pid

      - name: Check services
        run: |
          sleep 5

          echo "================ QEMU ================"
          cat qemu.log || true

          echo "================ noVNC ================"
          cat novnc.log || true

          echo "================ Bore ================"
          cat bore.log || true

          echo "================ Ports ================"
          ss -lntp | grep -E ':5900|:6080' || true

      - name: Keep VM running for 6 hours
        run: |
          echo "VM disponível por até 6 horas."

          timeout 6h bash -c '
            while kill -0 "$(cat qemu.pid)" 2>/dev/null; do
              sleep 20145
            done
          ' || true

          echo "Tempo máximo atingido ou QEMU terminou."

      - name: Show logs
        if: always()
        run: |
          echo "================ QEMU LOG ================"
          cat qemu.log || true

          echo "================ noVNC LOG ================"
          cat novnc.log || true

          echo "================ Bore LOG ================"
          cat bore.log || true
