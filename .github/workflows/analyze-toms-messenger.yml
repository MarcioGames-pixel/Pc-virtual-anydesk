name: Analyze Tom's Messenger 1.1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip zip file binutils python3

      - name: Download IPA
        run: |
          mkdir -p input
          wget --show-progress \
            -O "input/Toms-Messenger-1.1.ipa" \
            "https://archive.org/download/toms-messenger/iOS%20Version/Tom%27s%20Messenger%201.1%20%5BiOS4.1%5D.ipa"

      - name: Extract IPA
        run: |
          rm -rf extracted
          mkdir -p extracted
          unzip -q "input/Toms-Messenger-1.1.ipa" -d extracted

      - name: Locate app
        id: app
        shell: bash
        run: |
          set -e
          APP="$(find extracted/Payload -maxdepth 1 -type d -name '*.app' | head -n 1)"

          if [ -z "$APP" ]; then
            echo "APP not found"
            exit 1
          fi

          echo "APP=$APP" >> "$GITHUB_OUTPUT"

      - name: Locate executable
        id: binary
        shell: bash
        run: |
          set -e

          APP="${{ steps.app.outputs.APP }}"
          EXEC=""

          for FILE in "$APP"/*; do
            if [ -f "$FILE" ]; then
              TYPE="$(file "$FILE" || true)"

              if echo "$TYPE" | grep -q "Mach-O"; then
                EXEC="$FILE"
                break
              fi
            fi
          done

          if [ -z "$EXEC" ]; then
            echo "Mach-O executable not found"
            exit 1
          fi

          echo "EXEC=$EXEC" >> "$GITHUB_OUTPUT"

          file "$EXEC"

      - name: Extract strings
        run: |
          set -e

          mkdir -p reports

          EXEC="${{ steps.binary.outputs.EXEC }}"

          strings -a -n 4 "$EXEC" \
            > reports/strings.txt || true

          grep -Ein \
            'addon|add.?on|category|categories|wardrobe|inventory|storeinventory|background|gina|angela|tom|ben|pierre|ginger|documents|plist|purchase|purchased|unlock|unlocked|store|shop' \
            reports/strings.txt \
            > reports/interesting-strings.txt || true

      - name: Download Ghidra
        shell: bash
        run: |
          set -e

          GHIDRA_URL="$(
            python3 - <<'PY'
          import json
          import urllib.request

          url = "https://api.github.com/repos/NationalSecurityAgency/ghidra/releases/latest"

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "github-actions"}
          )

          with urllib.request.urlopen(request) as response:
              data = json.load(response)

          for asset in data.get("assets", []):
              name = asset.get("name", "")

              if (
                  name.endswith(".zip")
                  and "PUBLIC" in name
                  and "source" not in name.lower()
              ):
                  print(asset["browser_download_url"])
                  break
          else:
              raise SystemExit("Ghidra ZIP not found")
          PY
          )"

          wget --show-progress \
            -O ghidra.zip \
            "$GHIDRA_URL"

          unzip -q ghidra.zip

          GHIDRA_DIR="$(
            find . -maxdepth 1 \
              -type d \
              -name 'ghidra_*_PUBLIC' \
              | head -n 1
          )"

          if [ -z "$GHIDRA_DIR" ]; then
            echo "Ghidra directory not found"
            exit 1
          fi

          GHIDRA_DIR="$(realpath "$GHIDRA_DIR")"

          echo "GHIDRA_DIR=$GHIDRA_DIR" >> "$GITHUB_ENV"

      - name: Prepare script
        run: |
          mkdir -p ghidra_scripts

          cp tools/TomsMessengerAnalysis.java \
            ghidra_scripts/TomsMessengerAnalysis.java

      - name: Run Ghidra
        shell: bash
        run: |
          set -eux

          mkdir -p ghidra-project
          mkdir -p reports

          EXEC="${{ steps.binary.outputs.EXEC }}"

          "$GHIDRA_DIR/support/analyzeHeadless" \
            "$GITHUB_WORKSPACE/ghidra-project" \
            "TomsMessenger11" \
            -import "$EXEC" \
            -scriptPath "$GITHUB_WORKSPACE/ghidra_scripts" \
            -postScript TomsMessengerAnalysis.java \
            -overwrite \
            -analysisTimeoutPerFile 900 \
            -max-cpu 2 \
            -log "$GITHUB_WORKSPACE/reports/ghidra.log" \
            -scriptlog "$GITHUB_WORKSPACE/reports/ghidra-script.log"

      - name: Search application
        run: |
          set -e

          APP="${{ steps.app.outputs.APP }}"

          {
            echo "===== POTENTIAL WARDROBE FILES ====="

            find "$APP" -type f \
              \( \
                -iname '*addon*' \
                -o -iname '*wardrobe*' \
                -o -iname '*category*' \
                -o -iname '*inventory*' \
                -o -iname '*background*' \
                -o -iname '*gina*' \
                -o -iname '*angela*' \
                -o -iname '*.plist' \
              \) -print

            echo
            echo "===== ALL FILES ====="

            find "$APP" -type f -print

          } > reports/application-data-search.txt

      - name: Mach-O information
        run: |
          EXEC="${{ steps.binary.outputs.EXEC }}"

          {
            echo "===== FILE ====="
            file "$EXEC"

            echo
            echo "===== OBJDUMP ====="
            objdump -f "$EXEC" || true
          } > reports/macho-info.txt

      - name: Create extracted ZIP
        run: |
          set -e

          mkdir -p artifacts

          cd extracted

          zip -r -q \
            "../artifacts/Toms-Messenger-1.1-extracted.zip" \
            Payload

          cd ..

      - name: Create analysis ZIP
        run: |
          set -e

          mkdir -p artifacts

          zip -r -q \
            "artifacts/Toms-Messenger-1.1-analysis.zip" \
            reports \
            ghidra_scripts \
            ghidra-project

      - name: Upload extracted IPA
        uses: actions/upload-artifact@v4
        with:
          name: Toms-Messenger-1.1-extracted
          path: artifacts/Toms-Messenger-1.1-extracted.zip
          retention-days: 30
          compression-level: 0

      - name: Upload analysis
        uses: actions/upload-artifact@v4
        with:
          name: Toms-Messenger-1.1-Ghidra-analysis
          path: artifacts/Toms-Messenger-1.1-analysis.zip
          retention-days: 30
          compression-level: 0

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: Toms-Messenger-1.1-reports
          path: reports/
          retention-days: 30
          compression-level: 9
