name: RccService

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Download 0.206.zip
        shell: cmd
        run: |
          curl.exe -L --fail ^
            -H "ngrok-skip-browser-warning: true" ^
            -H "User-Agent: Mozilla/5.0" ^
            -o 0.206.zip ^
            "https://somnolently-cryptogrammatic-shandi.ngrok-free.dev/0.206.zip"

          echo.
          echo === Arquivo baixado ===
          dir 0.206.zip

      - name: Verify ZIP
        shell: pwsh
        run: |
          $file = Get-Item "0.206.zip"

          Write-Host "Tamanho: $($file.Length) bytes"

          if ($file.Length -lt 1000000) {
            Write-Host ""
            Write-Host "Resposta recebida:"
            Get-Content "0.206.zip" -Raw
            throw "O download não parece ser o 0.206.zip."
          }

          $bytes = [System.IO.File]::ReadAllBytes("0.206.zip")

          if (
            $bytes[0] -ne 0x50 -or
            $bytes[1] -ne 0x4B -or
            $bytes[2] -ne 0x03 -or
            $bytes[3] -ne 0x04
          ) {
            throw "O arquivo baixado não possui assinatura ZIP válida."
          }

          Write-Host "ZIP válido."

      - name: Extract RccService
        shell: pwsh
        run: |
          if (Test-Path "RccService") {
            Remove-Item "RccService" -Recurse -Force
          }

          New-Item -ItemType Directory -Path "RccService" | Out-Null

          Expand-Archive `
            -Path "0.206.zip" `
            -DestinationPath "RccService" `
            -Force

      - name: Check RccService files
        shell: pwsh
        run: |
          Write-Host "=== Conteúdo extraído ==="

          Get-ChildItem "RccService" -Force

          if (!(Test-Path "RccService\start.bat")) {
            throw "RccService\start.bat não encontrado."
          }

          if (!(Test-Path "RccService\RccService.exe")) {
            throw "RccService\RccService.exe não encontrado."
          }

          Write-Host ""
          Write-Host "=== start.bat ==="

          Get-Content "RccService\start.bat"

      - name: Start RccService
        shell: pwsh
        run: |
          $workingDir = Join-Path $PWD "RccService"

          Write-Host "Diretório:"
          Write-Host $workingDir

          $process = Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c", "start.bat" `
            -WorkingDirectory $workingDir `
            -PassThru

          Write-Host "Processo iniciado."
          Write-Host "PID: $($process.Id)"

          Start-Sleep -Seconds 10

      - name: Check RccService process
        shell: pwsh
        run: |
          Write-Host "=== Processos RccService ==="

          Get-Process -Name "RccService" `
            -ErrorAction SilentlyContinue |
            Select-Object Id,ProcessName,CPU,WorkingSet

      - name: Wait for port 64989
        shell: pwsh
        run: |
          Write-Host "=== Aguardando porta 64989 ==="

          $listening = $false

          for ($i = 1; $i -le 30; $i++) {

            $connection = Get-NetTCPConnection `
              -LocalPort 64989 `
              -State Listen `
              -ErrorAction SilentlyContinue

            if ($connection) {
              Write-Host "Porta 64989 está aberta."
              $connection | Format-Table
              $listening = $true
              break
            }

            Write-Host "Aguardando... tentativa $i/30"
            Start-Sleep -Seconds 2
          }

          if (!$listening) {
            Write-Host "Porta 64989 não abriu."

            Write-Host ""
            Write-Host "=== Portas abertas ==="

            Get-NetTCPConnection `
              -State Listen `
              -ErrorAction SilentlyContinue |
              Sort-Object LocalPort |
              Format-Table LocalAddress,LocalPort,OwningProcess

            throw "RccService não abriu a porta 64989."
          }

      - name: Start Bore
        shell: pwsh
        run: |
          Write-Host "=== Baixando Bore ==="

          $url = "https://github.com/ekzhang/bore/releases/latest/download/bore-v0.5.2-x86_64-pc-windows-msvc.zip"

          Invoke-WebRequest `
            -Uri $url `
            -OutFile "bore.zip"

          Write-Host "=== Extraindo Bore ==="

          if (Test-Path "bore") {
            Remove-Item "bore" -Recurse -Force
          }

          Expand-Archive `
            -Path "bore.zip" `
            -DestinationPath "bore" `
            -Force

          $bore = Get-ChildItem "bore" `
            -Filter "bore.exe" `
            -Recurse |
            Select-Object -First 1

          if (!$bore) {
            throw "bore.exe não encontrado."
          }

          Write-Host "Bore:"
          Write-Host $bore.FullName

          Write-Host ""
          Write-Host "=== Iniciando Bore ==="
          Write-Host "Destino: bore.pub"
          Write-Host "Porta local: 64989"
          Write-Host "Porta pública solicitada: 64989"

          Start-Process `
            -FilePath $bore.FullName `
            -ArgumentList "local", "64989", "--to", "bore.pub", "--port", "64989" `
            -RedirectStandardOutput "$PWD\bore.log" `
            -RedirectStandardError "$PWD\bore-error.log" `
            -WindowStyle Hidden

          Start-Sleep -Seconds 8

          Write-Host ""
          Write-Host "=== Bore STDOUT ==="

          if (Test-Path "bore.log") {
            Get-Content "bore.log"
          }

          Write-Host ""
          Write-Host "=== Bore STDERR ==="

          if (Test-Path "bore-error.log") {
            Get-Content "bore-error.log"
          }

      - name: Check Bore
        shell: pwsh
        run: |
          Write-Host "=== Processo Bore ==="

          $bore = Get-Process `
            -Name "bore" `
            -ErrorAction SilentlyContinue

          if ($bore) {
            $bore |
              Select-Object Id,ProcessName,CPU,WorkingSet |
              Format-Table

            Write-Host "Bore está rodando."
          }
          else {
            Write-Host "Bore não está rodando."

            if (Test-Path "bore-error.log") {
              Write-Host ""
              Write-Host "=== Erro do Bore ==="
              Get-Content "bore-error.log"
            }

            throw "Bore encerrou."
          }

      - name: Show connection information
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "=========================================="
          Write-Host "          RCCSERVICE ONLINE"
          Write-Host "=========================================="
          Write-Host ""
          Write-Host "Local: 127.0.0.1:64989"
          Write-Host "Bore:  bore.pub:64989"
          Write-Host ""
          Write-Host "=== Bore log ==="

          if (Test-Path "bore.log") {
            Get-Content "bore.log"
          }

          Write-Host ""
          Write-Host "=========================================="

      - name: Show RccService log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "RccService\rcc.log") {
            Write-Host "=== rcc.log ==="
            Get-Content "RccService\rcc.log" -Tail 200
          }
          else {
            Write-Host "rcc.log não encontrado."
          }

      - name: Keep RccService and Bore running
        shell: pwsh
        run: |
          while ($true) {

            $rcc = Get-Process `
              -Name "RccService" `
              -ErrorAction SilentlyContinue

            $bore = Get-Process `
              -Name "bore" `
              -ErrorAction SilentlyContinue

            if ($rcc) {
              Write-Host "$(Get-Date) - RccService está rodando."
            }
            else {
              Write-Host "$(Get-Date) - RccService encerrou."
              break
            }

            if ($bore) {
              Write-Host "$(Get-Date) - Bore está rodando."
            }
            else {
              Write-Host "$(Get-Date) - Bore encerrou."

              if (Test-Path "bore-error.log") {
                Write-Host "=== Bore error ==="
                Get-Content "bore-error.log" -Tail 100
              }

              break
            }

            Start-Sleep -Seconds 30
          }
