name: RccService

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download 0.206.zip
        shell: pwsh
        run: |
          $url = "https://somnolently-cryptogrammatic-shandi.ngrok-free.dev/0.206.zip"

          Write-Host "Baixando:"
          Write-Host $url

          try {
            Invoke-WebRequest `
              -Uri $url `
              -OutFile "0.206.zip" `
              -MaximumRedirection 10 `
              -UseBasicParsing `
              -ErrorAction Stop
          }
          catch {
            Write-Host "ERRO no download:"
            Write-Host $_
            exit 1
          }

          $file = Get-Item "0.206.zip"

          Write-Host ""
          Write-Host "Arquivo recebido:"
          Write-Host "Nome: $($file.Name)"
          Write-Host "Tamanho: $($file.Length) bytes"

          Write-Host ""
          Write-Host "Primeiros bytes:"

          Format-Hex -Path "0.206.zip" -Count 64

          if ($file.Length -lt 1000000) {
            Write-Host ""
            Write-Host "ERRO: o arquivo recebido é muito pequeno para ser o 0.206.zip."
            exit 1
          }

          $header = [System.IO.File]::ReadAllBytes("0.206.zip")[0..3]

          if ($header[0] -ne 0x50 -or
              $header[1] -ne 0x4B -or
              $header[2] -ne 0x03 -or
              $header[3] -ne 0x04) {

            Write-Host "ERRO: o arquivo não possui assinatura ZIP válida."
            exit 1
          }

          Write-Host "ZIP válido."

      - name: Extract RccService
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "RccService" -Force | Out-Null

          Expand-Archive `
            -Path "0.206.zip" `
            -DestinationPath "RccService" `
            -Force

      - name: Verify RccService
        shell: pwsh
        run: |
          Get-ChildItem "RccService" -Force

          if (!(Test-Path "RccService\start.bat")) {
            throw "RccService\start.bat não encontrado."
          }

          if (!(Test-Path "RccService\RccService.exe")) {
            throw "RccService\RccService.exe não encontrado."
          }

      - name: Show start.bat
        shell: cmd
        run: |
          type RccService\start.bat

      - name: Start RccService
        shell: pwsh
        run: |
          Start-Process `
            -FilePath "cmd.exe" `
            -ArgumentList "/c", "start.bat" `
            -WorkingDirectory "$PWD\RccService"

          Start-Sleep -Seconds 10

      - name: Check RccService
        shell: pwsh
        run: |
          Get-Process RccService -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "=== Portas ==="

          Get-NetTCPConnection `
            -State Listen `
            -ErrorAction SilentlyContinue |
            Sort-Object LocalPort |
            Format-Table LocalAddress,LocalPort,OwningProcess

      - name: Show rcc.log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "RccService\rcc.log") {
            Get-Content "RccService\rcc.log" -Tail 200
          }

      - name: Keep alive
        shell: pwsh
        run: |
          while (Get-Process RccService -ErrorAction SilentlyContinue) {
            Start-Sleep -Seconds 30
          }
