name: RccService

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download 0.206.zip
        shell: cmd
        run: |
          curl -L --fail -o 0.206.zip "https://somnolently-cryptogrammatic-shandi.ngrok-free.dev/0.206.zip"

      - name: Extract
        shell: pwsh
        run: |
          Expand-Archive -Path 0.206.zip -DestinationPath RccService -Force

      - name: Check files
        shell: cmd
        run: |
          dir RccService
          if exist "RccService\start.bat" (
            echo start.bat encontrado
          ) else (
            echo ERRO: start.bat nao encontrado
            exit /b 1
          )

      - name: Start RccService
        shell: cmd
        run: |
          cd /d RccService
          call start.bat

      - name: Keep alive
        shell: cmd
        run: |
          timeout /t 21600 /nobreak
