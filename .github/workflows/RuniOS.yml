name: QEMU-iOS iPod touch 2G - Black Screen Debug

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  debug:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Instalar dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            ca-certificates \
            unzip \
            tar \
            gzip \
            file \
            procps \
            net-tools \
            iproute2 \
            lsof \
            psmisc \
            libglib2.0-0 \
            libpixman-1-0 \
            libslirp0 \
            libssl3 \
            libsdl2-2.0-0 \
            libsndio7.0 \
            qemu-system-common \
            novnc \
            websockify

      - name: Criar diretórios
        run: |
          rm -rf qemu-artifact ios_files diagnostics
          mkdir -p qemu-artifact ios_files diagnostics

      - name: Baixar artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -o qemu-artifact.zip \
            "https://api.github.com/repos/MarcioGames-pixel/Pc-virtual-anydesk/actions/artifacts/10659859280/zip"

          test -s qemu-artifact.zip
          unzip -q qemu-artifact.zip -d qemu-artifact

          QEMU="$(find qemu-artifact -type f -name 'qemu-system-arm' | head -n 1)"

          test -n "$QEMU"

          cp "$QEMU" ios_files/qemu-system-arm
          chmod +x ios_files/qemu-system-arm

      - name: Verificar bibliotecas
        working-directory: ios_files
        run: |
          ldd ./qemu-system-arm | tee ../diagnostics/ldd.txt

          MISSING="$(ldd ./qemu-system-arm | grep 'not found' || true)"

          if [ -n "$MISSING" ]; then
            echo "$MISSING" | tee ../diagnostics/missing-libraries.txt
            exit 1
          fi

      - name: Verificar QEMU
        working-directory: ios_files
        run: |
          file ./qemu-system-arm | tee ../diagnostics/qemu-file.txt
          ./qemu-system-arm --version | tee ../diagnostics/qemu-version.txt
          ./qemu-system-arm -M help | tee ../diagnostics/machines.txt
          ./qemu-system-arm -M help | grep -iE 'ipod|touch' | tee ../diagnostics/ipod-machine.txt || true

      - name: Verificar display
        working-directory: ios_files
        run: |
          ./qemu-system-arm -display help \
            | tee ../diagnostics/display-help.txt \
            || true

          ./qemu-system-arm -vnc help \
            | tee ../diagnostics/vnc-help.txt \
            || true

      - name: Preparar keymap
        working-directory: ios_files
        run: |
          mkdir -p qemu-data/keymaps

          KEYMAP="$(find /usr/share/qemu \
            -type f \
            -name 'en-us' \
            2>/dev/null \
            | head -n 1)"

          if [ -z "$KEYMAP" ]; then
            find /usr/share/qemu \
              -maxdepth 3 \
              -type f \
              2>/dev/null \
              | tee ../diagnostics/qemu-share-files.txt

            exit 1
          fi

          cp "$KEYMAP" qemu-data/keymaps/en-us

          ls -lh qemu-data/keymaps/en-us
          file qemu-data/keymaps/en-us \
            | tee ../diagnostics/keymap-file.txt

      - name: Baixar BootROM
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o bootrom_240_4 \
            "https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/bootrom_240_4"

          test -s bootrom_240_4

      - name: Baixar iBoot
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o iBoot.bin \
            "https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/iBoot.bin"

          test -s iBoot.bin

      - name: Baixar NOR
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o nor_7E18.bin \
            "https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/nor_7E18.bin"

          test -s nor_7E18.bin

      - name: Baixar NAND
        working-directory: ios_files
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o nand-canonical.tar.gz \
            "https://github.com/samhenrigold/qemu-ios/releases/download/ipod-touch-2g-2026.08/nand-canonical.tar.gz"

          test -s nand-canonical.tar.gz

          mkdir -p nand
          tar -xzf nand-canonical.tar.gz -C nand

          find nand -type f \
            | tee ../diagnostics/nand-files.txt

      - name: Validar arquivos
        working-directory: ios_files
        run: |
          test -s bootrom_240_4
          test -s iBoot.bin
          test -s nor_7E18.bin

          NAND_COUNT="$(find nand -type f | wc -l)"

          if [ "$NAND_COUNT" -eq 0 ]; then
            exit 1
          fi

      - name: Iniciar QEMU
        working-directory: ios_files
        run: |
          rm -f qemu.log qemu.pid

          ./qemu-system-arm \
            -L "$PWD/qemu-data" \
            -M iPod-Touch,bootrom=bootrom_240_4,nand=nand,nor=nor_7E18.bin \
            -serial mon:stdio \
            -cpu max \
            -m 2G \
            -d unimp,guest_errors \
            -vnc :0 \
            > qemu.log 2>&1 &

          echo $! > qemu.pid

          sleep 15

          if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
            cat qemu.log
            exit 1
          fi

      - name: Diagnóstico inicial
        working-directory: ios_files
        run: |
          ps -p "$(cat qemu.pid)" \
            -o pid,ppid,stat,etime,%cpu,%mem,cmd \
            | tee ../diagnostics/qemu-process-initial.txt

          ss -lntp \
            | tee ../diagnostics/ports-initial.txt

          tail -300 qemu.log \
            | tee ../diagnostics/qemu-initial.log

      - name: Aguardar VNC
        working-directory: ios_files
        run: |
          FOUND=0

          for i in $(seq 1 60); do
            if ss -lnt | grep -q ':5900'; then
              FOUND=1
              break
            fi

            sleep 2
          done

          if [ "$FOUND" -ne 1 ]; then
            ss -lnt
            cat qemu.log
            exit 1
          fi

          ss -lntp \
            | tee ../diagnostics/vnc-listen.txt

      - name: Testar TCP VNC
        working-directory: ios_files
        run: |
          timeout 5 bash -c \
            '</dev/tcp/127.0.0.1/5900'

      - name: Testar handshake VNC
        working-directory: ios_files
        run: |
          timeout 5 \
            bash -c \
            'exec 3<>/dev/tcp/127.0.0.1/5900; head -c 12 <&3' \
            | tee ../diagnostics/vnc-handshake.txt \
            || true

      - name: Iniciar noVNC
        working-directory: ios_files
        run: |
          rm -f novnc.log novnc.pid

          websockify \
            --web=/usr/share/novnc \
            6080 \
            127.0.0.1:5900 \
            > novnc.log 2>&1 &

          echo $! > novnc.pid

          sleep 5

          if ! kill -0 "$(cat novnc.pid)" 2>/dev/null; then
            cat novnc.log
            exit 1
          fi

          curl -f \
            http://127.0.0.1:6080/vnc.html \
            -o ../diagnostics/vnc.html

      - name: Testar noVNC
        working-directory: ios_files
        run: |
          curl -f -I \
            http://127.0.0.1:6080/vnc.html \
            | tee ../diagnostics/novnc-http.txt

          ss -lntp \
            | tee ../diagnostics/novnc-listen.txt

      - name: Instalar Bore
        run: |
          curl -fL --retry 5 --retry-delay 3 \
            -o bore.tar.gz \
            "https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz"

          tar -xzf bore.tar.gz
          chmod +x bore
          sudo mv bore /usr/local/bin/bore

          bore --version

      - name: Expor noVNC
        working-directory: ios_files
        run: |
          rm -f bore.log bore.pid

          bore local 6080 \
            --to bore.pub \
            > bore.log 2>&1 &

          echo $! > bore.pid

          sleep 10

          if ! kill -0 "$(cat bore.pid)" 2>/dev/null; then
            cat bore.log
            exit 1
          fi

          cat bore.log

      - name: Analisar LCD framebuffer e display
        working-directory: ios_files
        run: |
          grep -Ein \
            'lcd|framebuffer|frame buffer|display|surface|scanout|fb0|fb1|pixel|layer|iosurface|mipi|dsi|panel|backlight|brightness|vsync|vblank|gpu|opengl|egl|render|blit|flush' \
            qemu.log \
            | tee ../diagnostics/display-matches.txt \
            || true

      - name: Analisar boot
        working-directory: ios_files
        run: |
          grep -Ein \
            'bootrom|iboot|kernel|kernelcache|darwin|xnu|launchd|SpringBoard|panic|paniclog|exception|abort|fatal|reset|watchdog|shutdown|power' \
            qemu.log \
            | tee ../diagnostics/boot-matches.txt \
            || true

      - name: Analisar erros
        working-directory: ios_files
        run: |
          grep -Ein \
            'error|failed|failure|unimplemented|unsupported|invalid|abort|segfault|SIGSEGV' \
            qemu.log \
            | tee ../diagnostics/error-matches.txt \
            || true

      - name: Capturar logs
        if: always()
        working-directory: ios_files
        run: |
          cp qemu.log ../diagnostics/qemu-full.log || true
          cp novnc.log ../diagnostics/novnc.log || true
          cp bore.log ../diagnostics/bore.log || true

          ps -p "$(cat qemu.pid)" \
            -o pid,ppid,stat,etime,%cpu,%mem,cmd \
            | tee ../diagnostics/qemu-process-final.txt \
            || true

          ss -lntp \
            | tee ../diagnostics/ports-final.txt \
            || true

          tail -500 qemu.log \
            | tee ../diagnostics/qemu-final.log \
            || true

      - name: Publicar diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipod-touch-2g-black-screen-diagnostics
          path: |
            diagnostics/
            ios_files/qemu.log
            ios_files/novnc.log
            ios_files/bore.log
          if-no-files-found: warn
          retention-days: 14

      - name: Manter VM ativa
        working-directory: ios_files
        run: |
          while true; do
            if ! kill -0 "$(cat qemu.pid)" 2>/dev/null; then
              tail -500 qemu.log
              exit 1
            fi

            if ! kill -0 "$(cat novnc.pid)" 2>/dev/null; then
              cat novnc.log
              exit 1
            fi

            if ! kill -0 "$(cat bore.pid)" 2>/dev/null; then
              cat bore.log
              exit 1
            fi

            echo "$(date '+%H:%M:%S') - QEMU ativo"

            ps -p "$(cat qemu.pid)" \
              -o pid,stat,etime,%cpu,%mem \
              || true

            ss -lnt | grep ':5900' || true
            ss -lnt | grep ':6080' || true

            sleep 15
          done
