name: Build iPod touch 2G NAND - iOS 4.2.1

on:
  workflow_dispatch:
    inputs:
      blocks:
        description: "HFS allocation blocks"
        required: true
        default: "128000"
        type: string

jobs:
  build-nand:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ipsw
        shell: bash
        run: |
          set -euo pipefail

          brew tap blacktop/tap
          brew trust blacktop/tap
          brew install blacktop/tap/ipsw

          ipsw help >/dev/null
          echo "ipsw installed"

      - name: Download qemu-ios-tools
        shell: bash
        run: |
          set -euo pipefail

          rm -rf qemu-ios-tools

          git clone \
            --depth 1 \
            --branch ipod_touch_2g \
            https://github.com/samhenrigold/qemu-ios.git \
            qemu-ios-tools

          test -f qemu-ios-tools/imgtools/build_nand.py
          test -f qemu-ios-tools/imgtools/hfsvol.py
          test -f qemu-ios-tools/imgtools/nandblob.py
          test -f qemu-ios-tools/imgtools/ftlmap.py
          test -f qemu-ios-tools/imgtools/pack_nand.py

          echo "IMGTOOLS_DIR=$PWD/qemu-ios-tools/imgtools" >> "$GITHUB_ENV"

          echo "imgtools:"
          ls -lh qemu-ios-tools/imgtools

      - name: Download iOS 4.2.1 IPSW
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ipsw

          ipsw download ipsw \
            --device iPod2,1 \
            --build 8C148 \
            --output ipsw \
            --confirm

          IPSW="$(find ipsw -maxdepth 1 -type f -name '*.ipsw' -print -quit)"

          if [[ -z "$IPSW" ]]; then
            echo "ERROR: IPSW was not downloaded"
            find ipsw -maxdepth 2 -type f -print
            exit 1
          fi

          echo "IPSW=$IPSW" >> "$GITHUB_ENV"

          EXPECTED="d1b96e80504d817b5398822e2027b1c896227e1de3674d08a100330ea5a5a8d4"
          ACTUAL="$(shasum -a 256 "$IPSW" | awk '{print $1}')"

          echo "Expected SHA256: $EXPECTED"
          echo "Actual SHA256:   $ACTUAL"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "ERROR: IPSW SHA256 mismatch"
            exit 1
          fi

          ls -lh "$IPSW"

      - name: Inspect IPSW
        shell: bash
        run: |
          set -euo pipefail

          unzip -l "$IPSW" | grep -E \
            '038-0014-002\.dmg|kernelcache\.release\.n72|BuildManifest\.plist'

      - name: Extract IPSW files
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted
          mkdir -p extracted

          unzip -j \
            "$IPSW" \
            "038-0014-002.dmg" \
            "kernelcache.release.n72" \
            -d extracted

          test -f extracted/038-0014-002.dmg
          test -f extracted/kernelcache.release.n72

          echo "RootFS:"
          ls -lh extracted/038-0014-002.dmg

          echo
          echo "Kernelcache:"
          ls -lh extracted/kernelcache.release.n72

      - name: Prepare imgtools
        shell: bash
        run: |
          set -uo pipefail

          python3 --version

          FAILED=0

          for f in \
            build_nand.py \
            hfsvol.py \
            nandblob.py \
            ftlmap.py \
            pack_nand.py
          do
            FILE="$IMGTOOLS_DIR/$f"

            echo
            echo "===== $FILE ====="

            if [[ ! -f "$FILE" ]]; then
              echo "MISSING: $FILE"
              FAILED=1
              continue
            fi

            if python3 -m py_compile "$FILE"; then
              echo "COMPILE OK: $f"
            else
              echo "COMPILE FAILED: $f"
              FAILED=1
            fi
          done

          if [[ "$FAILED" -ne 0 ]]; then
            exit 1
          fi

          echo
          echo "All imgtools compiled successfully."

      - name: Download n72ap NAND template
        shell: bash
        run: |
          set -euo pipefail

          URL="https://github.com/devos50/qemu-ios/releases/download/n72ap_v1/nand_n72ap.zip"

          rm -rf template-extract nand-template
          mkdir -p template-extract

          echo "Downloading:"
          echo "$URL"

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-all-errors \
            --connect-timeout 30 \
            -o nand_n72ap.zip \
            "$URL"

          test -s nand_n72ap.zip

          echo
          echo "Template archive:"
          ls -lh nand_n72ap.zip

          unzip -q nand_n72ap.zip -d template-extract

          if [[ -d template-extract/nand ]]; then
            mv template-extract/nand nand-template
          else
            echo "ERROR: archive does not contain nand/"
            find template-extract -maxdepth 3 -type d -print
            exit 1
          fi

          for cs in 0 1 2 3; do
            if [[ ! -d "nand-template/cs${cs}" ]]; then
              echo "ERROR: missing cs${cs}"
              exit 1
            fi
          done

          echo
          echo "NAND template:"
          du -sh nand-template

          for cs in 0 1 2 3; do
            COUNT="$(find "nand-template/cs${cs}" -type f -name '*.page' | wc -l | tr -d ' ')"
            echo "cs${cs}: ${COUNT} pages"
          done

      - name: Validate NAND template
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_PAGE_SIZE=4160

          for cs in 0 1 2 3; do
            DIR="nand-template/cs${cs}"

            COUNT="$(find "$DIR" -type f -name '*.page' | wc -l | tr -d ' ')"

            if [[ "$COUNT" -eq 0 ]]; then
              echo "ERROR: cs${cs} contains no pages"
              exit 1
            fi

            echo "Checking cs${cs}: ${COUNT} pages"

            SAMPLE="$(find "$DIR" -type f -name '*.page' | head -n 1)"

            SIZE="$(stat -f '%z' "$SAMPLE")"

            if [[ "$SIZE" -ne "$EXPECTED_PAGE_SIZE" ]]; then
              echo "ERROR: $SAMPLE has size $SIZE"
              echo "Expected $EXPECTED_PAGE_SIZE bytes"
              exit 1
            fi
          done

          echo
          echo "NAND template validation OK."

      - name: Build NAND from IPSW
        shell: bash
        env:
          BLOCKS: ${{ inputs.blocks }}
        run: |
          set -euo pipefail

          rm -rf output-nand work-nand

          echo "Building synthetic n72ap NAND"
          echo "Blocks: $BLOCKS"

          python3 "$IMGTOOLS_DIR/build_nand.py" \
            --rootfs "$PWD/extracted/038-0014-002.dmg" \
            --kernelcache "$PWD/extracted/kernelcache.release.n72" \
            --template "$PWD/nand-template" \
            --out "$PWD/output-nand" \
            --blocks "$BLOCKS" \
            --workdir "$PWD/work-nand"

          echo
          echo "NAND build finished."

          for cs in 0 1 2 3; do
            test -d "output-nand/cs${cs}"
          done

          du -sh output-nand

      - name: Validate generated NAND
        shell: bash
        run: |
          set -euo pipefail

          TOTAL=0

          for cs in 0 1 2 3; do
            COUNT="$(find "output-nand/cs${cs}" -type f -name '*.page' | wc -l | tr -d ' ')"

            if [[ "$COUNT" -eq 0 ]]; then
              echo "ERROR: output cs${cs} has no pages"
              exit 1
            fi

            echo "output cs${cs}: ${COUNT} pages"

            TOTAL=$((TOTAL + COUNT))
          done

          echo
          echo "Total NAND pages: $TOTAL"

          if [[ "$TOTAL" -le 0 ]]; then
            echo "ERROR: generated NAND is empty"
            exit 1
          fi

          SAMPLE="$(find output-nand -type f -name '*.page' | head -n 1)"
          SIZE="$(stat -f '%z' "$SAMPLE")"

          echo "Sample page size: $SIZE bytes"

          if [[ "$SIZE" -ne 4160 ]]; then
            echo "ERROR: generated NAND page is not 4160 bytes"
            exit 1
          fi

          echo
          echo "Generated NAND validation OK."

      - name: Pack NAND
        shell: bash
        run: |
          set -euo pipefail

          rm -rf packed
          mkdir -p packed

          python3 "$IMGTOOLS_DIR/pack_nand.py" \
            output-nand \
            packed/n72ap_8C148.itnand

          test -f packed/n72ap_8C148.itnand

          echo
          echo "Packed NAND:"
          ls -lh packed/n72ap_8C148.itnand

      - name: Create NAND ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf release
          mkdir -p release

          cp packed/n72ap_8C148.itnand \
            release/n72ap_8C148.itnand

          cp -R output-nand \
            release/nand_n72ap_8C148

          cd release

          zip -r -q \
            ../nand_n72ap_8C148.zip \
            n72ap_8C148.itnand \
            nand_n72ap_8C148

          cd ..

          ls -lh nand_n72ap_8C148.zip

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          shasum -a 256 \
            nand_n72ap_8C148.zip \
            packed/n72ap_8C148.itnand \
            > SHA256SUMS

          cat SHA256SUMS

      - name: Upload NAND artifacts
        uses: actions/upload-artifact@v4
        with:
          name: iPod2,1-iOS-4.2.1-8C148-NAND
          path: |
            nand_n72ap_8C148.zip
            packed/n72ap_8C148.itnand
            SHA256SUMS
          compression-level: 0
          if-no-files-found: error
