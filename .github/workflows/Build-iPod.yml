name: Build iPod touch 2G NAND - iOS 4.2.1

on:
  workflow_dispatch:
    inputs:
      blocks:
        description: "HFS allocation blocks"
        required: true
        default: "128000"
        type: string

jobs:
  build-nand:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ipsw
        shell: bash
        run: |
          set -euo pipefail

          brew tap blacktop/tap
          brew trust blacktop/tap
          brew install blacktop/tap/ipsw

      - name: Download iOS 4.2.1 IPSW
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ipsw

          ipsw download ipsw \
            --device iPod2,1 \
            --build 8C148 \
            --output ipsw \
            --confirm

          IPSW="$(find ipsw -maxdepth 1 -type f -name '*.ipsw' -print -quit)"

          if [[ -z "$IPSW" ]]; then
            echo "ERROR: IPSW was not downloaded"
            find ipsw -maxdepth 2 -type f -print
            exit 1
          fi

          echo "IPSW=$IPSW" >> "$GITHUB_ENV"

          EXPECTED="d1b96e80504d817b5398822e2027b1c896227e1de3674d08a100330ea5a5a8d4"
          ACTUAL="$(shasum -a 256 "$IPSW" | awk '{print $1}')"

          echo "Expected SHA256: $EXPECTED"
          echo "Actual SHA256:   $ACTUAL"

          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "ERROR: IPSW SHA256 mismatch"
            exit 1
          fi

          ls -lh "$IPSW"

      - name: Extract IPSW files
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p extracted

          unzip -j \
            "$IPSW" \
            "038-0014-002.dmg" \
            "kernelcache.release.n72" \
            -d extracted

          test -f extracted/038-0014-002.dmg
          test -f extracted/kernelcache.release.n72

          echo "RootFS:"
          ls -lh extracted/038-0014-002.dmg

          echo "Kernelcache:"
          ls -lh extracted/kernelcache.release.n72

      - name: Locate and prepare imgtools
        shell: bash
        run: |
          set -uo pipefail

          echo "Procurando build_nand.py..."

          BUILD_NAND="$(find . -type f -name 'build_nand.py' -print -quit)"

          if [[ -z "$BUILD_NAND" ]]; then
            echo "ERROR: build_nand.py não encontrado no repositório."
            echo
            echo "Arquivos Python encontrados:"
            find . -type f -name '*.py' -print | head -100
            exit 1
          fi

          IMGTOOLS_DIR="$(dirname "$BUILD_NAND")"

          echo "imgtools encontrado em:"
          echo "$IMGTOOLS_DIR"

          echo "IMGTOOLS_DIR=$IMGTOOLS_DIR" >> "$GITHUB_ENV"

          for f in \
            build_nand.py \
            hfsvol.py \
            nandblob.py \
            ftlmap.py \
            pack_nand.py
          do
            if [[ ! -f "$IMGTOOLS_DIR/$f" ]]; then
              echo "MISSING: $IMGTOOLS_DIR/$f"
              exit 1
            fi

            echo "OK: $IMGTOOLS_DIR/$f"
          done

          echo
          echo "Compilando..."

          FAILED=0

          for f in \
            build_nand.py \
            hfsvol.py \
            nandblob.py \
            ftlmap.py \
            pack_nand.py
          do
            echo
            echo "===== $IMGTOOLS_DIR/$f ====="

            if python3 -m py_compile "$IMGTOOLS_DIR/$f"; then
              echo "COMPILE OK: $f"
            else
              echo "COMPILE FAILED: $f"
              FAILED=1
            fi
          done

          if [[ "$FAILED" -ne 0 ]]; then
            exit 1
          fi

          echo "Todos os imgtools foram encontrados e compilados."

      - name: Download NAND template
        shell: bash
        env:
          NAND_TEMPLATE_URL: ${{ secrets.NAND_TEMPLATE_URL }}
        run: |
          set -euo pipefail

          if [[ -z "${NAND_TEMPLATE_URL:-}" ]]; then
            echo "ERROR: NAND_TEMPLATE_URL secret is not configured."
            exit 1
          fi

          rm -rf template-extract nand-template
          mkdir -p template-extract

          curl -L \
            --fail \
            --retry 5 \
            --retry-all-errors \
            "$NAND_TEMPLATE_URL" \
            -o nand_n72ap.zip

          unzip -q nand_n72ap.zip -d template-extract

          if [[ -d template-extract/nand ]]; then
            mv template-extract/nand nand-template
          else
            echo "ERROR: archive does not contain nand/"
            find template-extract -maxdepth 3 -type d -print
            exit 1
          fi

          for cs in 0 1 2 3; do
            test -d "nand-template/cs${cs}"
          done

          echo "NAND template encontrado."

      - name: Validate NAND template
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import os
          import sys

          root = "nand-template"

          expected = {
              "cs0": 32017,
              "cs1": 32014,
              "cs2": 32014,
              "cs3": 32015,
          }

          total = 0

          for cs, wanted in expected.items():
              path = os.path.join(root, cs)

              files = [
                  x for x in os.listdir(path)
                  if x.endswith(".page") and x[:-5].isdigit()
              ]

              print(f"{cs}: {len(files)} pages")

              if len(files) != wanted:
                  print(
                      f"ERROR: expected {wanted} pages in {cs}, "
                      f"got {len(files)}"
                  )
                  sys.exit(1)

              total += len(files)

              if not files:
                  print(f"ERROR: {cs} está vazio")
                  sys.exit(1)

              sample = os.path.join(path, files[0])
              size = os.path.getsize(sample)

              if size != 4160:
                  print(
                      f"ERROR: {sample}: "
                      f"{size} bytes, expected 4160"
                  )
                  sys.exit(1)

          print(f"total: {total} pages")
          print("template validation OK")
          PY

      - name: Build NAND
        shell: bash
        env:
          BLOCKS: ${{ inputs.blocks }}
        run: |
          set -euo pipefail

          rm -rf output-nand work-nand

          python3 "$IMGTOOLS_DIR/build_nand.py" \
            --rootfs "extracted/038-0014-002.dmg" \
            --kernelcache "extracted/kernelcache.release.n72" \
            --template "$PWD/nand-template" \
            --out "$PWD/output-nand" \
            --blocks "$BLOCKS" \
            --workdir "$PWD/work-nand" \
            --keep-work

      - name: Validate generated NAND
        shell: bash
        run: |
          set -euo pipefail

          for cs in 0 1 2 3; do
            test -d "output-nand/cs${cs}"

            count="$(find "output-nand/cs${cs}" \
              -maxdepth 1 \
              -type f \
              -name '*.page' \
              | wc -l \
              | tr -d ' ')"

            echo "output cs${cs}: ${count} pages"

            if [[ "$count" -eq 0 ]]; then
              echo "ERROR: cs${cs} is empty"
              exit 1
            fi
          done

          python3 - <<'PY'
          import os
          import sys

          checked = 0

          for cs in range(4):
              path = f"output-nand/cs{cs}"

              for name in os.listdir(path):
                  if not name.endswith(".page"):
                      continue

                  full = os.path.join(path, name)
                  size = os.path.getsize(full)

                  if size != 4160:
                      print(
                          f"ERROR: {full}: "
                          f"{size} bytes, expected 4160"
                      )
                      sys.exit(1)

                  checked += 1

          print(f"Checked {checked} NAND pages.")
          print("Generated NAND validation OK")
          PY

      - name: Pack NAND
        shell: bash
        run: |
          set -euo pipefail

          python3 "$IMGTOOLS_DIR/pack_nand.py" \
            output-nand \
            nand_n72ap_4.2.1_8C148.itnand

          test -f nand_n72ap_4.2.1_8C148.itnand

          ls -lh nand_n72ap_4.2.1_8C148.itnand

      - name: Create ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -f nand_n72ap_4.2.1_8C148.zip

          (
            cd output-nand
            zip -qr \
              ../nand_n72ap_4.2.1_8C148.zip \
              .
          )

          test -f nand_n72ap_4.2.1_8C148.zip

          ls -lh nand_n72ap_4.2.1_8C148.zip

      - name: Upload NAND page directory
        uses: actions/upload-artifact@v4
        with:
          name: nand-n72ap-4.2.1-8C148-pages
          path: output-nand/
          if-no-files-found: error
          retention-days: 7

      - name: Upload packed NAND
        uses: actions/upload-artifact@v4
        with:
          name: nand-n72ap-4.2.1-8C148-packed
          path: nand_n72ap_4.2.1_8C148.itnand
          if-no-files-found: error
          retention-days: 7

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: nand-n72ap-4.2.1-8C148-zip
          path: nand_n72ap_4.2.1_8C148.zip
          if-no-files-found: error
          retention-days: 7
